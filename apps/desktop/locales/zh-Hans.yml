    ssh_program: 连 SSH 主机时调的 ssh，留空用 PATH 里的 ssh。照样读 ~/.ssh/config，ProxyJump、ssh-agent、1Password 都能用。
    ssh_control_persist: 最后一个终端关掉后，到这台主机的连接再留多少秒，这期间重连不用再输密码。0 是一直留着。退出 Runode 时总会断开。
    ssh_restore_on_launch: 打开 Runode、恢复 SSH 主机上的工作区和终端时马上连那台主机。关掉后等你点「立即重连」才连，打开 Runode 时不会先问密码。下次启动起生效。
