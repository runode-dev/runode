    preview_font_size: 单位是点。
    theme: 下面写了的颜色会盖过主题。选「浅色深色分开」时跟着系统外观换。
    background: "颜色，比如 #1e1e2e，或者颜色名。"
    foreground: 文字的颜色。
    cursor_color: 颜色，或者 cell-foreground、cell-background（跟随光标所在格子）。留空用前景色。
    cursor_text: 块状光标下文字的颜色。留空用背景色。
    selection_background: 颜色，或者 cell-foreground、cell-background。留空按背景深浅用一种蓝色。
    selection_foreground: 颜色，或者 cell-foreground、cell-background。留空保持文字原来的颜色。
    search_background: 颜色，或者 cell-foreground、cell-background。
    search_foreground: 颜色，或者 cell-foreground、cell-background。
    search_selected_background: 颜色，或者 cell-foreground、cell-background。
    search_selected_foreground: 颜色，或者 cell-foreground、cell-background。
    palette: 0–7 是普通色，8–15 是亮色。清空一格就回到主题里的颜色。
    cursor_style: 运行中的程序仍然可以改。
    cursor_style_blink: 运行中的程序仍然可以打开或关掉闪烁。
    cursor_style_blink_timeout: 这么多秒没有输入也没有输出，光标就停止闪烁、常亮。0 表示一直闪。
    macos_option_as_alt: 打开后按 Option 组合键发的是 Alt 组合，不再输入特殊字符。
    scrollback_limit: 每个终端的回滚历史最多占多少字节，至少 2 MiB（2097152），另外最多 1 万行。
    shell_integration: 自动检测按 shell 的程序名判断。跳提示符、命令历史和建议都靠它。
    shell_integration_features: 提示符上用竖线，zsh 的 vi 命令模式里用方块，跑命令时恢复成上面的光标形状。对新开的终端生效。
    command_suggestions: 输入时按命令历史用灰字给出后半截，按 → 或 End 接受。关掉时也不读写命令历史。
    command_completions: 按 Tab 弹出命令、子命令、选项和参数的菜单。关掉时 Tab 总是交给 shell。
    command_highlighting: 输入时给命令、选项、字符串和路径上色；shell 自己已经上了色时不管。
    clipboard_write: 终端里的程序（vim、tmux、经 ssh 连到远端的 shell 等）能把文字放进剪贴板。
    clipboard_read: 终端里的程序能读到你复制过的文字，密码也在内。选“询问”时先说明是哪个程序要读。
    terminal_host: 退出 Runode 后会话留在后台进程里照常运行，下次打开接着用。
    remote_access: 让配对过的手机经局域网或 Tailscale 连上这台 Mac 的终端。在下面配对，或者用 runode remote pair。
    remote_access_port: TCP 端口，1 到 65535。
    agent_notifications: agent 在你没在看的分屏里干完了或者等你回答时发系统通知。只有打包好的 Runode.app 能发通知。
    agent_notifications_exclude: 选中的 agent 不发通知也不出提示音，状态标记照常显示。
    agent_done_sound: 系统自带的声音。
    agent_blocked_sound: 系统自带的声音。
    config_file: 读完这个文件之后再读的配置文件。相对路径从这个文件所在目录算；路径前加 ? 表示文件可以不存在。
    keybind: 你的快捷键叠在默认快捷键上。
  choice:
    window_style:
      cards: 卡片
      classic: 经典
    cursor_style:
      block: 方块
      bar: 竖线
      underline: 下划线
      block_hollow: 空心方块
    cursor_style_blink:
      "true": 闪烁
      "false": 不闪烁
    macos_option_as_alt:
      "false": 关
      "true": 两边
      left: 左边
      right: 右边
    shell_integration:
      detect: 自动检测
      none: 关
      zsh: zsh
      bash: bash
      fish: fish
    shell_integration_features:
      cursor: 竖线
      no-cursor: 不改
    file_tree_preview_click:
      single: 单击
      double: 双击
    clipboard_write:
      allow: 允许
