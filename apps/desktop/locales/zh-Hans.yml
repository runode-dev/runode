      deny: 拒绝
  pairing:
    title: 配对手机
    hint: 用手机上的 Runode 扫码配对。配好的手机在远程访问打开时能连上这台 Mac。
    "off": 先打开上面的远程访问，再来配对。
    start: 配对…
    again: 再配一台
    cancel: 取消
    copy: 拷贝链接
    waiting: "用手机上的 Runode 扫这个二维码，或者把链接发到手机上打开。%{time} 内有效，等手机连上来。"
    paired: "已和 %{name} 配对。"
    background: 退出 Runode 时远程访问跟着停，手机就连不上了。打开后退出时会话和远程访问留在后台。
    not_listening: 远程访问没在监听。刚打开的话等几秒再试；一直这样的话，端口可能被占了，宿主的日志里有原因。
    stopped: 等手机时远程访问停了。
    invalidated: 口令输错太多次，已经作废，再配对一次。
    expired: 口令过期了，手机没来配对。
    replaced: 另一处（比如 runode remote pair）开始了新的配对，这个口令作废了。
    too_long: 配对链接太长，画不成二维码。
    io_failed: "没能读写配对口令：%{err}"
  keybind:
    action: 动作
    unbind: 去掉快捷键
    use_defaults: 使用默认快捷键
    use_defaults_hint: 关掉后只有下面你写的快捷键生效。
    yours: 你的快捷键
    add: 添加快捷键…
    press: 按下快捷键…（Esc 取消）
    defaults: 默认快捷键
    unbind_default: 去掉
    overridden: 已改动
