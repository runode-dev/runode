  unreachable_detail: 这次终端跑在 app 里，退出 Runode 时一起结束。（%{reason}）
  ok: 好
  handoff_failed_title: 没能把终端交给这个版本的 Runode
  handoff_failed_detail: 旧版本的 %{count} 个终端还在它的宿主里照常运行，没受影响。这次终端跑在这个 app 里，runode list 这类命令行连到的仍是旧终端。保留的话，下次打开 Runode 时再试；结束的话，旧终端会全部关闭。（%{reason}）
  handoff_failed_detail_uncounted: 旧版本的终端还在它的宿主里照常运行，没受影响。这次终端跑在这个 app 里，runode list 这类命令行连到的仍是旧终端。保留的话，下次打开 Runode 时再试；结束的话，旧终端会全部关闭。（%{reason}）
  old_app_title: 旧版本的 Runode 还开着
  old_app_detail: 它开着时终端没法交给这个版本，这次终端跑在这个 app 里，退出时一起结束。先退出旧版本的 Runode，再重新打开这一个。
  keep_old: 保留旧会话
  end_old: 结束旧会话
  already_upgraded_title: 终端已经交给这个版本了
  already_upgraded_detail: "终端宿主已经是这个版本的 Runode，旧终端最后还是交了过来，一个都没结束，照常运行。这个窗口仍用自己的终端；退出后重新打开 Runode 就能看到交过来的终端。"
  build_mismatch_title: 终端宿主和这个 Runode 的版本不一致
  build_mismatch_detail: 终端宿主是 %{host}，这个 app 是 %{app}。终端照常能用，但有些功能可能对不上。退出 Runode 后重新打开，会让这个版本的宿主接手终端。
  shared_host_detail: 终端宿主是 %{host}，这个 app 是 %{app}。宿主上还连着别的 Runode（这台电脑上别的版本，或者别的电脑经 SSH 连过来的），终端交不过来，这个 app 和它共用宿主，终端照常能用，但有些功能可能对不上。那边都断开后重新打开 Runode，会让这个版本的宿主接手终端。
  degraded_title: Runode 已更新
  degraded_detail: 升级时 %{count} 个终端的回滚历史没能带过来，屏幕和正在运行的程序都不受影响。
