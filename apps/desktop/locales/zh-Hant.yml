    search_selected_background: 顏色，或 cell-foreground、cell-background。
    search_selected_foreground: 顏色，或 cell-foreground、cell-background。
    palette: 0–7 是一般色，8–15 是亮色。清空一格就回到主題裡的顏色。
    cursor_style: 執行中的程式仍然可以改。
    cursor_style_blink: 執行中的程式仍然可以打開或關掉閃爍。
    cursor_style_blink_timeout: 這麼多秒沒有輸入也沒有輸出，游標就停止閃爍、常亮。0 表示一直閃。
    macos_option_as_alt: 打開後按 Option 組合鍵送出的是 Alt 組合，不再輸入特殊字元。
    scrollback_limit: 每個終端機的回捲歷史最多佔多少位元組，至少 2 MiB（2097152），另外最多 1 萬行。
    shell_integration: 自動偵測依 shell 的程式名判斷。跳提示字元、指令歷史和建議都靠它。
    shell_integration_features: 提示字元上用直線，zsh 的 vi 命令模式裡用方塊，執行指令時恢復成上面的游標形狀。對新開的終端機生效。
    command_suggestions: 輸入時依指令歷史用灰字給出後半段，按 → 或 End 接受。關掉時也不讀寫指令歷史。
    command_completions: 按 Tab 彈出指令、子指令、選項和參數的選單。關掉時 Tab 總是交給 shell。
    command_highlighting: 輸入時給指令、選項、字串和路徑上色；shell 自己已經上了色時不管。
    clipboard_write: 終端機裡的程式（vim、tmux、經 ssh 連到遠端的 shell 等）能把文字放進剪貼簿。
    clipboard_read: 終端機裡的程式能讀到你複製過的文字，密碼也在內。選「詢問」時先說明是哪個程式要讀。
    terminal_host: 結束 Runode 後工作階段留在背景程序裡照常執行，下次打開接著用。
    auto_update: 在背景查新版本、下載好，結束 Runode 時裝上。
    remote_access: 讓配對過的手機經區域網路或 Tailscale 連上這台 Mac 的終端機。在下面配對，或者用 runode remote pair。
    remote_access_port: TCP 連接埠，1 到 65535。
    agent_notifications: agent 在你沒在看的分割畫面裡完成或等你回答時發系統通知。只有打包好的 Runode.app 能發通知。
    agent_notifications_exclude: 選中的 agent 不發通知也不出提示音，狀態標記照常顯示。
    agent_done_sound: 系統內建的聲音。
    agent_blocked_sound: 系統內建的聲音。
    config_file: 讀完這個檔案之後再讀的設定檔。相對路徑從這個檔案所在目錄算；路徑前加 ? 表示檔案可以不存在。
