host:
  incompatible_title: 舊版 Runode 的終端機宿主還在執行
  incompatible_detail: 這次終端機跑在 app 裡，runode list 這類指令列連不上它們。結束另一個 Runode 或者它的宿主程序後，重新開啟 Runode。（%{reason}）
  other_app_title: 另一個 Runode 正在執行終端機宿主
  other_app_detail: 這次終端機跑在這個 app 裡，結束時一起關閉；runode list 這類指令列連到的是另一個 Runode。結束另一個 Runode 後，重新開啟這一個。
  unreachable_title: 連不上 Runode 的終端機宿主
  unreachable_detail: 這次終端機跑在 app 裡，結束 Runode 時一起關閉。（%{reason}）
  ok: 好
  handoff_failed_title: 沒能把終端機交給這個版本的 Runode
  handoff_failed_detail: 舊版的 %{count} 個終端機還在它的宿主裡照常執行，沒有受到影響。這次終端機跑在這個 app 裡，runode list 這類指令列連到的仍是舊的終端機。保留的話，下次開啟 Runode 時再試；終止的話，舊的終端機會全部關閉。（%{reason}）
  handoff_failed_detail_uncounted: 舊版的終端機還在它的宿主裡照常執行，沒有受到影響。這次終端機跑在這個 app 裡，runode list 這類指令列連到的仍是舊的終端機。保留的話，下次開啟 Runode 時再試；終止的話，舊的終端機會全部關閉。（%{reason}）
  old_app_title: 舊版的 Runode 還開著
  old_app_detail: 它開著的時候，終端機沒辦法交給這個版本，這次終端機跑在這個 app 裡，結束時一起關閉。請先結束舊版的 Runode，再重新開啟這一個。
  keep_old: 保留舊工作階段
  end_old: 終止舊工作階段
  already_upgraded_title: 終端機已經交給這個版本了
  already_upgraded_detail: 終端機宿主已經是這個版本的 Runode，所以什麼都沒有終止：舊的終端機最後還是交過來了，在那裡照常執行。這個視窗仍用自己的終端機；結束後重新開啟 Runode 就能看到交過來的終端機。
  build_mismatch_title: 終端機宿主和這個 Runode 的版本不一致
  build_mismatch_detail: 終端機宿主是 %{host}，這個 app 是 %{app}。終端機照常能用，但有些功能可能對不上。結束 Runode 後重新開啟，會讓這個版本的宿主接手終端機。
  degraded_title: Runode 已更新
  degraded_detail: 升級時有 %{count} 個終端機的捲動紀錄沒能帶過來，畫面和正在執行的程式都不受影響。
