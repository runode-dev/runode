    palette: Colors 0–7 are the normal colors and 8–15 the bright ones. Clear a box to go back to the theme's color.
    cursor_style: Programs can still change it while they run.
    cursor_style_blink: Programs can still turn blinking on or off while they run.
    cursor_style_blink_timeout: Seconds without typing or output before the cursor stops blinking. 0 keeps blinking.
    macos_option_as_alt: Option then sends Alt combinations instead of typing special characters.
    scrollback_limit: Bytes of history kept per terminal, at least 2 MiB (2097152), and at most 10,000 lines.
    shell_integration: Detect picks by the shell's program name. Needed for prompt jumps, command history and suggestions.
    shell_integration_features: "A bar at the prompt, a block in zsh's vi command mode, back to the cursor style while a command runs. Applies to new terminals."
    command_suggestions: Suggests the rest of a command from history in gray; → or End accepts it. Off also stops reading and writing history.
    command_completions: Tab shows a menu of commands, subcommands, options and arguments. Off always passes Tab to the shell.
    command_highlighting: Colors commands, options, strings and paths as you type, unless the shell already does.
    clipboard_write: Lets programs in the terminal, such as vim, tmux or a shell over ssh, put text on the clipboard.
    clipboard_read: Lets programs in the terminal read the text you copied, passwords included. Ask shows which program wants it first.
    terminal_host: Sessions keep running in a background process after Runode quits and come back when it opens again.
    auto_update: Check for new versions in the background, download them and install them when Runode quits.
    remote_access: Lets a paired phone reach the terminals over the local network or Tailscale. Pair below, or with runode remote pair.
    remote_access_port: TCP port, 1 to 65535.
    remote_access_name: "The name paired phones show. When empty, the system computer name. Connected phones drop briefly when it changes."
    remote_access_push: When an agent waits for your answer, paired phones show it in the Dynamic Island and on the Lock Screen, even with the app closed.
    remote_access_push_text: Sends the question and choices from the bottom of the screen. Off sends only the title and the agent.
    remote_access_push_delay: Seconds the agent has to keep waiting first, so answering at the computer doesn't buzz the phone. 0 notifies right away.
    apns_key_file: Only needed to push straight to APNs for a phone app you build and sign yourself; leave it empty for the official app. Path to the .p8 key file from your Apple developer account; ~ stands for $HOME.
    apns_key_id: The 10-character ID of that key, also in its file name AuthKey_ID.p8.
    apns_team_id: Your 10-character Apple developer team ID.
    apns_bundle_id: The bundle ID of your build of the phone app.
    push_relay_url: The service that sends pushes for the official phone app.
    agent_notifications: Notifies you when an agent you are not looking at finishes or needs an answer. Only the packaged Runode.app can notify.
    agent_notifications_exclude: These agents get neither notifications nor sounds; their status marks still show.
    agent_done_sound: A system sound.
    agent_blocked_sound: A system sound.
    config_file: Other configuration files to read after this one. Relative paths start from this file's folder; a leading ? means the file may be missing.
    keybind: Your shortcuts are added on top of the defaults.
