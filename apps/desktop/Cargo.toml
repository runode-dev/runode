[package]
name = "runode"
description = "Desktop workspace for AI coding agents, built on libghostty-vt and GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-paths.workspace = true
runode-git.workspace = true
runode-shared-types.workspace = true
runode-terminal.workspace = true
# 终端会话的宿主：跑在 app 进程里，或者由 app 拉起成单独一个进程（`runode --host`）。
runode-host.workspace = true
# 和宿主之间的帧和消息，两种跑法都经一条连接说话。
runode-protocol.workspace = true
# 带子命令启动时走命令行，见 `runode_cli::wants_cli`。
runode-cli.workspace = true
# 配置文件的读取、主题、快捷键的写法和配置模板。
runode-config.workspace = true
# 远程访问的监听跟着宿主活：宿主跑在 app 里时由 app 开，单独跑时由 `runode --host` 开。
runode-remote.workspace = true
# 自动更新：查新版本、下载、核对签名、退出时换上 .app。
runode-update.workspace = true
runode-autostart.workspace = true
# 几处界面共用的 GPUI 部件和小工具，连同所有图标。
runode-ui.workspace = true
# 预览栏读文件、判断类型、语法高亮和 Markdown 解析，不碰界面。
runode-preview.workspace = true
# 设置页里配对手机时画二维码。
qrcode.workspace = true
gpui.workspace = true
# 不开 font-kit 时，gpui_macos 退回到空实现的文字系统，一个字形都画不出来。
gpui_platform = { workspace = true, features = ["font-kit"] }
anyhow.workspace = true
futures.workspace = true
# 和宿主的连接设 socket 缓冲。
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 界面文字的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制。
rust-i18n.workspace = true
# 窗口布局的存档，存成 JSON。
serde.workspace = true
serde_json.workspace = true
# 右侧面板监听仓库目录，有文件变了才重读 git 状态。
notify.workspace = true
# 文件树按内容搜时标出结果里命中的那一段。
regex.workspace = true

# 标准「关于」面板、系统偏好的语言和窗口菜单只有 AppKit 提供，GPUI 没有封装。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
# 「关于」面板的内容和系统偏好的语言；文件树删除文件时移到废纸篓，用 NSFileManager。
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSLocale", "NSString", "NSURL"] }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem", "NSEvent", "NSView", "NSWindow", "NSScreen"] }
# 问系统设置里有没有允许发通知，设置页在被拒时提示。
objc2-user-notifications = { workspace = true, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
block2.workspace = true
# 程序要求改窗口尺寸时经 AppKit 改窗口的 frame。
raw-window-handle.workspace = true

[lints]
workspace = true
