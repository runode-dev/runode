# 发版。两种发法，后面走的路一样：
#
#   - 在 Actions 页面手动运行（workflow_dispatch），填版本号或者留空让补丁号加一：在 main 上改好
#     workspace 的 `version`（`[workspace.package]`）和 Cargo.lock，提交，打标签（v0.2.0），推上去；
#   - 自己改版本号、提交、打同名标签推上来（push 标签），一般用 scripts/release.sh：它还写好中英双语的
#     更新说明 docs/releases/vX.Y.Z.md 一起提交。标签只认 main 上的提交。
#
# 之后：对这个标签跑一遍 CI（ci.yml），同时在 Apple 芯片的 runner 上打 arm64 和 x86_64 两份 dmg（也是自动更新
# 下载的包，x86_64 交叉编译，Intel runner 慢一倍），用 Developer ID 签名、公证；在 x86_64 和
# aarch64 的 Linux 上各打一份只有可执行文件的 tar.gz（没有桌面界面，用命令行和 `runode --host`）；在
# Windows 上打 x86_64 的安装包 setup.exe（Inno Setup，装到用户目录），可执行文件和安装包都用自签名证书签名；
# x86_64 的 Mac 包再到 Intel 的 runner 上跑一下；CI 和各个包都成了才汇总起来生成版本清单 latest.json 和校验和 SHA256SUMS，先发成草稿、文件都传齐了再
# 公开；最后在 macOS 和 Linux 上各用 scripts/install.sh、在 Windows 上静默运行 setup.exe 装一遍这个版本，
# 确认装得上、跑得起来。
#
# app 经 releases/latest/download/latest.json 查新版本（`runode_update::MANIFEST_URL`），
# scripts/install.sh 也从 releases/latest/download/ 下载，所以 Release 一公开，开着自动更新的 app
# 就会去下载，新装的也是这个版本。版本号只能是 x.y.z：Info.plist 的 CFBundleShortVersionString 和
# app 比较版本（`runode_update` 的 `version_parts`）都只认数字。
#
# beta 版用同样的 x.y.z 版本号，说明文件 docs/releases/vX.Y.Z.md 第一行是 `<!-- prerelease -->`
# （scripts/release.sh --beta 写上）时发成预发布、不标 latest：releases/latest 还指着上一个正式版，
# 自动更新和不带版本号的安装都拿不到它，要装 beta 的用 RUNODE_VERSION 指定版本。测好了转正：
# `gh release edit vX.Y.Z --prerelease=false --latest --title "Runode X.Y.Z"`，不用重新构建。
#
# 要在仓库的 Secrets 里配：
#   MACOS_CERTIFICATE           Developer ID Application 证书连私钥导出的 .p12，base64 编码
#   MACOS_CERTIFICATE_PASSWORD  导出 .p12 时设的密码
#   SIGN_IDENTITY               签名身份，比如 "Developer ID Application: 名字 (TEAMID)"
#   NOTARY_KEY_P8               App Store Connect API 密钥（.p8 文件的内容），权限要能公证
#   NOTARY_KEY_ID               这把密钥的 ID
#   NOTARY_ISSUER               App Store Connect 的 Issuer ID
#   WINDOWS_CERTIFICATE          Windows 代码签名证书连私钥的 .pfx，base64 编码
#   WINDOWS_CERTIFICATE_PASSWORD 导出 .pfx 时设的密码
#
# 手动运行时用 GITHUB_TOKEN 推提交和标签：main 开了分支保护的话，要在保护规则里允许 GitHub Actions
# 推送。GITHUB_TOKEN 推的标签不会再触发这个工作流，所以不会发两遍。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 要发的版本号，比如 0.2.0；留空时补丁号加一
        type: string
        required: false

# 同一时间只发一个版本，不取消正在跑的：发到一半取消会留下推了标签却没有 Release 的局面。排队的只留一个，
# 再来一个会把排着的那次取消掉，所以发版脚本在有发版在跑或排队时不推标签；还是被取消了的，
# 在 Actions 页面对那个标签的运行点 Re-run。
concurrency:
  group: release

# 默认只读；只有推提交和标签的 prepare、建 Release 的 publish 要写。构建的 job 里有签名证书和
# 公证密钥，又跑第三方 action 和整棵依赖树的 build.rs，不给它们写仓库的令牌。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 推送中转只编进发布的版本，见 `runode_protocol::push::RELAY_URL`。
  RUNODE_PUSH_RELAY: https://push.runode.dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # 手动发版时查 main 的 CI。
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 要看标签在不在 main 上，手动发版时还要在 main 上提交。
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: 定版本号
        id: version
        env:
          WANTED: ${{ inputs.version }}
        run: |
          current=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$WANTED" ]]; then
              version=${WANTED#v}
            else
              IFS=. read -r major minor patch <<<"$current"
              version="$major.$minor.$((patch + 1))"
            fi
          else
            version=${GITHUB_REF_NAME#v}
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号 $version 不是 x.y.z" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "标签 v$version 已经有了" >&2
              exit 1
            fi
            # 新版本要比现在的大，app 才会更新过去。
            if [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" || "$current" == "$version" ]]; then
              echo "版本号 $version 不比现在的 $current 大" >&2
              exit 1
            fi
          else
            if [[ "$current" != "$version" ]]; then
              echo "标签 $GITHUB_REF_NAME 和 Cargo.toml 里的版本 $current 对不上" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "标签 $GITHUB_REF_NAME 指的提交不在 main 上" >&2
              exit 1
            fi
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
      - name: main 的 CI 过了才打标签
        # 和发版脚本一样：标签推上去就收不回来。只改了 CI 忽略的文件的提交不跑 CI，看最近一次。
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow ci.yml --branch main --limit 1 --json status,conclusion \
            --jq '.[0] | if .status == "completed" then .conclusion else .status end')
          if [[ "$conclusion" != success ]]; then
            echo "main 最近一次 CI 是 ${conclusion:-没跑过}，过了再发" >&2
            exit 1
          fi
      - name: 装 Rust 工具链、拉子模块
        # 更新 Cargo.lock 要读到所有 workspace 的包，有的依赖在子模块里（vendor/libghostty-rs）。
        if: github.event_name == 'workflow_dispatch'
        run: |
          rustup toolchain install --profile minimal
          make submodules
      - name: 改版本号、提交、打标签、推上去
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i '/^\[workspace.package\]/,/^\[/s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          # 只更新 Cargo.lock 里 workspace 自己的包的版本，不动依赖。
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: 发布 v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin main "v$VERSION"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  build-macos:
    # 不等 CI，和它同时跑；publish 等两边都成了才发。
    needs: prepare
    # 两份都在 Apple 芯片上编，x86_64 经 CARGO_BUILD_TARGET 交叉编译。包名里的架构由打包脚本按
    # `lipo -archs` 取，这里的 arch 只用来给产物和缓存起名。
    strategy:
      matrix:
        include:
          # uuid 是打包脚本给这个架构写进程序的固定 UUID，每个版本都一样，见下面的核对。
          - arch: arm64
            target: aarch64-apple-darwin
            uuid: 1D1AFDE6-3D39-5E7B-A9D8-E30F3FB0C040
          - arch: x86_64
            target: x86_64-apple-darwin
            uuid: 9214D93C-3F36-574E-B25E-6F340825BCAF
    runs-on: macos-15
    # Intel 慢一倍再加公证时间也够；公证卡住时别等到 GitHub 的 6 小时上限。
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # 子模块是公开仓库，之后不再碰仓库，不把令牌留在 .git/config 里。
          persist-credentials: false
      - name: 拉子模块
        run: make submodules
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.17.0
      - name: 装 Rust 工具链
        run: |
          rustup toolchain install
          rustup target add "$CARGO_BUILD_TARGET"
      - name: 确认有 Metal 编译器
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # 带上目标三元组，不接着用以前在 Intel runner 上存的缓存。
          key: macos-${{ matrix.target }}
      # rust-cache 存缓存前清理 target，会删掉 sherpa-onnx-sys 下到 target/sherpa-onnx-prebuilt 的静态库（只留下
      # 空目录），它构建脚本的输出却留着、不再重跑，链接时找不到库；库不在时清掉这个包，让构建脚本重新下载。
      - name: 缓存里没有 sherpa-onnx 的预编译库时重新下载
        shell: bash
        run: compgen -G 'target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api*' >/dev/null || cargo clean -p sherpa-onnx-sys
      # 参数和 bundle-macos.sh 里的 cargo build 一样，先在导入证书、写密钥前编完：依赖的构建脚本跑时钥匙串还没解锁、
      # 环境里也没有 NOTARY_KEY 这些，打包时那次 cargo build 基本什么都不用编。
      - name: 编译
        run: |
          for attempt in 1 2 3; do
            cargo build --profile release --locked && break
            [[ $attempt -lt 3 ]] || exit 1
            echo "编译失败（多半是 zig 下载依赖时断了连接），30 秒后重试" >&2
            sleep 30
          done
      - name: 导入签名证书
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$MACOS_CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # 让 codesign 用私钥时不弹框问。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: 写下公证用的 API 密钥
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: printf '%s\n' "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
      - name: 打包、签名、公证
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/bundle-macos.sh
      - name: 核对程序 UUID 是固定的
        # 本地网络权限按程序的 UUID 认 app，UUID 跟着版本变的话，升级后接手过来的终端连不上局域网，
        # 而且要到下次升级才看得出来，所以在这里拦住。
        run: |
          exe=target/release/bundle/Runode.app/Contents/MacOS/runode
          dwarfdump --uuid "$exe"
          dwarfdump --uuid "$exe" | grep -q "UUID: ${{ matrix.uuid }} " ||
            { echo "程序 UUID 不是固定的 ${{ matrix.uuid }}，见 scripts/bundle-macos.sh" >&2; exit 1; }
      - name: 删掉签名用的钥匙串和密钥
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-macos-${{ matrix.arch }}
          path: |
            target/release/bundle/Runode-*.dmg
          if-no-files-found: error

  build-linux:
    needs: prepare
    # 在较老的 Ubuntu 上编，glibc 版本低，新一些的发行版都能跑。不开 runode 的 linux-desktop 特性，
    # 可执行文件只依赖 libc，没有图形界面的服务器上也能跑命令行和宿主。
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: 拉子模块
        run: make submodules
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.17.0
      - name: 装 Rust 工具链
        run: rustup toolchain install
      - name: 装 GPUI 编译要的库
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libssl-dev libasound2-dev libzstd-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-${{ matrix.arch }}
      # rust-cache 存缓存前清理 target，会删掉 sherpa-onnx-sys 下到 target/sherpa-onnx-prebuilt 的静态库（只留下
      # 空目录），它构建脚本的输出却留着、不再重跑，链接时找不到库；库不在时清掉这个包，让构建脚本重新下载。
      - name: 缓存里没有 sherpa-onnx 的预编译库时重新下载
        shell: bash
        run: compgen -G 'target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api*' >/dev/null || cargo clean -p sherpa-onnx-sys
      - name: 构建、打包
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            cargo build --release -p runode --locked && break
            [[ $attempt -lt 3 ]] || exit 1
            echo "编译失败（多半是 zig 下载依赖时断了连接），30 秒后重试" >&2
            sleep 30
          done
          bundle=target/release/bundle
          mkdir -p "$bundle"
          tar -czf "$bundle/Runode-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C target/release runode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-linux-${{ matrix.arch }}
          path: target/release/bundle/Runode-*.tar.gz
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: 拉子模块
        run: make submodules
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.17.0
      - name: 装 Rust 工具链
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-x86_64
      # rust-cache 存缓存前清理 target，会删掉 sherpa-onnx-sys 下到 target/sherpa-onnx-prebuilt 的静态库（只留下
      # 空目录），它构建脚本的输出却留着、不再重跑，链接时找不到库；库不在时清掉这个包，让构建脚本重新下载。
      - name: 缓存里没有 sherpa-onnx 的预编译库时重新下载
        shell: bash
        run: compgen -G 'target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api*' >/dev/null || cargo clean -p sherpa-onnx-sys
      # 先在写出证书前编完：依赖的构建脚本跑时环境里还没有签名密钥。
      - name: 编译
        run: |
          for attempt in 1 2 3; do
            cargo build --release -p runode --locked && break
            [[ $attempt -lt 3 ]] || exit 1
            echo "编译失败（多半是 zig 下载依赖时断了连接），30 秒后重试" >&2
            sleep 30
          done
      - name: 写下签名证书
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: base64 --decode <<<"$WINDOWS_CERTIFICATE" >"$RUNNER_TEMP/codesign.pfx"
      - name: 签名、打包
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          signtool=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup -y --no-progress
          sign() { "$signtool" sign //fd sha256 //f "$(cygpath -w "$RUNNER_TEMP/codesign.pfx")" //p "$WINDOWS_CERTIFICATE_PASSWORD" "$@"; }
          release=target/release
          sign "$release/runode.exe" "$release/rn.exe"
          bundle=target/release/bundle
          mkdir -p "$bundle"
          "$iscc" //DAppVersion="$VERSION" //DSourceDir="$(cygpath -aw "$release")" \
            //DOutputDir="$(cygpath -aw "$bundle")" scripts/windows/runode.iss
          sign "$bundle/Runode-$VERSION-windows-x86_64-setup.exe"
      - name: 删掉签名证书
        if: always()
        run: rm -f "$RUNNER_TEMP/codesign.pfx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-windows-x86_64
          path: target/release/bundle/Runode-*-setup.exe
          if-no-files-found: error

  check-macos-x86_64:
    # x86_64 的 Mac 包是交叉编译的，打包时没跑过；公开前在 Intel 机器上跑一下，起不来就不发。
    # shortcut: 只能在 Intel runner 上跑，GitHub 停掉 macos-15-intel 时这一步等不到机器、整个发版卡住；
    # 到时改在 macos-15 上用 Rosetta 跑（arch -x86_64），或者不再发 x86_64。
    needs: [prepare, build-macos]
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-macos-x86_64
          path: bundle
      - name: 拷出 .app、核对版本号
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" bundle/Runode-"$VERSION"-macos-x86_64.dmg
          ditto "$RUNNER_TEMP/mnt/Runode.app" "$RUNNER_TEMP/app/Runode.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          reported=$("$RUNNER_TEMP/app/Runode.app/Contents/MacOS/runode" --version)
          echo "$reported"
          [[ "$reported" == "runode $VERSION."* ]] || { echo "跑出来的不是 $VERSION" >&2; exit 1; }

  publish:
    # CI 过了、各平台各架构都打好了、x86_64 的 Mac 包跑过了才发，缺一个就不发。
    needs: [prepare, ci, build-macos, build-linux, build-windows, check-macos-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          sparse-checkout: docs/releases
          # `gh` 用上面的 GH_TOKEN，不靠 checkout 留下的凭据。
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: target/release/bundle
          merge-multiple: true
      - name: 生成版本清单
        # 格式见 `runode_update::Release`：archives 给出自动更新用的包的下载地址，macOS 的 dmg 按架构名，
        # Windows 的安装包是 windows-x86_64。
        run: |
          bundle=target/release/bundle
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          archives='{}'
          for dmg in "$bundle"/Runode-"$VERSION"-macos-*.dmg; do
            name=$(basename "$dmg")
            arch=${name#Runode-"$VERSION"-macos-}
            arch=${arch%.dmg}
            archives=$(jq --arg arch "$arch" --arg url "$base/$name" '. + {($arch): $url}' <<<"$archives")
          done
          setup=Runode-"$VERSION"-windows-x86_64-setup.exe
          archives=$(jq --arg url "$base/$setup" '. + {"windows-x86_64": $url}' <<<"$archives")
          jq -n \
            --arg version "$VERSION" \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --argjson archives "$archives" \
            '{version: $version, page: $page, archives: $archives}' >"$bundle/latest.json"
          cat "$bundle/latest.json"
      - name: 校验和
        # SHA256SUMS 列出所有文件，scripts/install.sh 下载后按它核对。
        run: |
          cd target/release/bundle
          sha256sum Runode-*.dmg Runode-*.tar.gz Runode-*-setup.exe latest.json >SHA256SUMS
          cat SHA256SUMS
      - name: 发成草稿，传齐了再公开
        # 先建草稿再公开：传到一半时 releases/latest 还指着上一个版本，app 和安装脚本不会拿到缺文件的版本。
        # 更新说明用 scripts/release.sh 写的 docs/releases/$TAG.md，没有时让 GitHub 按 PR 生成；
        # 说明第一行是 `<!-- prerelease -->` 时发成 beta（见开头）。
        run: |
          bundle=target/release/bundle
          file="docs/releases/$TAG.md"
          notes=(--generate-notes)
          kind=(--title "Runode $VERSION")
          latest=--latest
          if [[ -f "$file" ]]; then
            notes=(--notes-file "$file")
            if [[ "$(head -1 "$file")" == "<!-- prerelease -->" ]]; then
              kind=(--title "Runode $VERSION Beta" --prerelease)
              latest=--latest=false
            fi
          fi
          # 推上来的标签可能是 main 上更早的、比现在的正式版旧的版本：那样不标 latest，免得 releases/latest
          # 往回退，自动更新和不带版本号的安装拿到旧版本。还没有正式版（接口回 404）时照常标；别的失败（网络、
          # 限流、权限）重试几次还不行就不发，不能当成没有正式版去标 latest。
          current=""
          for attempt in 1 2 3; do
            if current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>latest.err); then
              break
            fi
            current=""
            if grep -q 'HTTP 404' latest.err; then
              break
            fi
            cat latest.err >&2
            if [[ $attempt == 3 ]]; then
              echo "查不到现在的正式版，不知道这个版本该不该标 latest，不发了；重跑这个 job 即可" >&2
              exit 1
            fi
            sleep 10
          done
          rm -f latest.err
          current=${current#v}
          if [[ -n "$current" && "$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
            echo "Runode $current 比 $VERSION 新，这个版本不标 latest"
            latest=--latest=false
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${kind[@]}" \
            "${notes[@]}" \
            "$bundle"/Runode-*.dmg "$bundle"/Runode-*.tar.gz "$bundle"/Runode-*-setup.exe "$bundle/latest.json" \
            "$bundle/SHA256SUMS"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "$latest"

  verify:
    # 用户照 README 装会走的路：用这个版本的安装脚本装上，命令行报的版本号要对得上。
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel 走 Intel Mac 的安装路径，装的是 x86_64 的包。
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: 安装
        env:
          RUNODE_VERSION: ${{ needs.prepare.outputs.version }}
        run: RUNODE_BIN_DIR="$HOME/.local/bin" sh scripts/install.sh
      - name: 核对版本号
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          reported=$("$HOME/.local/bin/runode" --version)
          echo "$reported"
          [[ "$reported" == "runode $VERSION."* ]] || { echo "装上的不是 $VERSION" >&2; exit 1; }

  verify-windows:
    # Windows 用户会走的路：静默运行这个版本的 setup.exe，装好的命令行报的版本号要对得上。
    needs: [prepare, publish]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: 安装
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          setup=Runode-"$VERSION"-windows-x86_64-setup.exe
          curl -fL --retry 3 -o "$RUNNER_TEMP/$setup" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup"
          "$RUNNER_TEMP/$setup" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //NORUN
      - name: 核对版本号
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          reported=$("$LOCALAPPDATA/Programs/Runode/rn.exe" --version)
          echo "$reported"
          [[ "$reported" == "runode $VERSION."* ]] || { echo "装上的不是 $VERSION" >&2; exit 1; }
