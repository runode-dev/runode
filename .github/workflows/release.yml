# 推 v* 标签时发版：用 Developer ID 签名、公证，打包 dmg 和自动更新用的 zip，生成版本清单
# latest.json，一起发成 GitHub Release。app 经 releases/latest/download/latest.json 查新版本
# （`runode_update::MANIFEST_URL`），所以 Release 一发出去，开着自动更新的 app 就会去下载。
#
# 发版：改 workspace 的 `version`（`[workspace.package]`），提交，打同名的标签（v0.2.0）推上来。
#
# 要在仓库的 Secrets 里配：
#   MACOS_CERTIFICATE           Developer ID Application 证书连私钥导出的 .p12，base64 编码
#   MACOS_CERTIFICATE_PASSWORD  导出 .p12 时设的密码
#   SIGN_IDENTITY               签名身份，比如 "Developer ID Application: 名字 (TEAMID)"
#   NOTARY_KEY_P8               App Store Connect API 密钥（.p8 文件的内容），权限要能公证
#   NOTARY_KEY_ID               这把密钥的 ID
#   NOTARY_ISSUER               App Store Connect 的 Issuer ID
name: Release

on:
  push:
    tags: ["v*"]

# 同一个标签只发一次，不取消正在跑的。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Apple 芯片的 runner：发的是 arm64 的包。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 拉子模块
        run: make submodules
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: 装 Rust 工具链
        run: rustup toolchain install
      - name: 确认有 Metal 编译器
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
      - name: 核对版本号
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "runode") | .version')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "标签 $GITHUB_REF_NAME 和 Cargo.toml 里的版本 $version 对不上" >&2
            exit 1
          fi
      - name: 导入签名证书
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$MACOS_CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # 让 codesign 用私钥时不弹框问。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: 写下公证用的 API 密钥
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: printf '%s\n' "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
      - name: 打包、签名、公证
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/bundle-macos.sh
      - name: 生成版本清单
        # 格式见 `runode_update::Release`：archives 按架构名给出各个 zip 的下载地址。
        run: |
          version=${GITHUB_REF_NAME#v}
          bundle=target/release/bundle
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          archives='{}'
          for zip in "$bundle"/Runode-"$version"-*.zip; do
            name=$(basename "$zip")
            arch=${name#Runode-"$version"-}
            arch=${arch%.zip}
            archives=$(jq --arg arch "$arch" --arg url "$base/$name" '. + {($arch): $url}' <<<"$archives")
          done
          jq -n \
            --arg version "$version" \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --argjson archives "$archives" \
            '{version: $version, page: $page, archives: $archives}' >"$bundle/latest.json"
          cat "$bundle/latest.json"
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=target/release/bundle
          gh release create "$GITHUB_REF_NAME" --title "Runode ${GITHUB_REF_NAME#v}" --generate-notes \
            "$bundle"/Runode-*.dmg "$bundle"/Runode-*.zip "$bundle/latest.json"
