# 每次推到 main 和每个 PR：检查格式和 crate 分层（cargo-deny），再类型检查、跑测试、跑 clippy。
# libghostty-vt 从 vendor/ghostty 用 zig 编译，GPUI 要用 Xcode 的 Metal 编译器编着色器，
# 所以在 macOS 上跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 拉子模块
        run: make submodules
      # vendor/ghostty 的 build.zig.zon 要求的 zig 版本（minimum_zig_version）。
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: 装 Rust 工具链
        # 版本由 rust-toolchain.toml 指定。
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
      - name: 确认有 Metal 编译器
        # 新版 Xcode 把 Metal 工具链拆成了单独下载的组件。
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: 检查格式
        run: make fmt-check
      - name: 检查 crate 分层
        run: cargo deny check bans
      - name: 类型检查
        run: make check
      - name: 测试
        run: make test
      - name: clippy
        run: make clippy CLIPPY_ARGS="-- -D warnings"
