# 每次推到 main 和每个 PR：检查格式和 crate 分层（cargo-deny）、跑 clippy（含类型检查），测试在另一个任务里并行跑。
# libghostty-vt 从 vendor/ghostty 用 zig 编译，GPUI 要用 Xcode 的 Metal 编译器编着色器，
# 所以在 macOS 上跑。发版时 release.yml 也调它（workflow_call），对要发的那个标签再查一遍。
# iOS 端（RunodeKit）的测试由单独的 ios.yml 跑。
name: CI

# 只改文档、iOS/Android 端、发版和 issue 模板这类 Rust 编译和测试用不到的文件时不跑。skills/ 被编进 cli，
# 所以不在忽略之列。
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "apps/ios/**"
      - "apps/android/**"
      - "scripts/release.sh"
      - "scripts/install.sh"
      - "scripts/perf*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/ios.yml"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "apps/ios/**"
      - "apps/android/**"
      - "scripts/release.sh"
      - "scripts/install.sh"
      - "scripts/perf*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/ios.yml"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 要检查的提交、分支或标签
        type: string
        required: true

# 组名不能用 github.workflow：被 release.yml 调用时它是调用方的名字，和调用方自己的组撞上会互相等。
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# 只读仓库；单独由 push 或 PR 触发时权限不由仓库的默认设置决定。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # 发版提交只改版本号，不在 main 上重跑；发版流程对标签另查一遍，那时 ref 是标签，不受这条影响。
    if: "${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: 发布 v')) }}"
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt
      - name: 确认有 Metal 编译器
        # 新版 Xcode 把 Metal 工具链拆成了单独下载的组件。
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      - name: 检查格式
        run: make fmt-check
      # 后面的 cargo 命令会悄悄补上过期的 Cargo.lock，CI 照样绿，发版的 `--locked` 才失败；在这里先拦下。
      - name: 确认 Cargo.lock 是最新的
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: 检查 crate 分层
        run: cargo deny check bans
      - name: clippy
        run: make clippy CLIPPY_ARGS="-- -D warnings"

  # clippy 只做类型检查、不生成代码，测试的编译用不上它的产物，分开并行跑；各自的构建缓存也分开存。
  test:
    # 发版提交只改版本号，不在 main 上重跑；发版流程对标签另查一遍，那时 ref 是标签，不受这条影响。
    if: "${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: 发布 v')) }}"
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: 确认有 Metal 编译器
        # 新版 Xcode 把 Metal 工具链拆成了单独下载的组件。
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.146
      # 终端的集成测试要起这几个 shell，runner 上默认没有；RUNODE_REQUIRE_SHELLS 让缺了的直接失败，不悄悄跳过。
      # 系统自带的 bash 是 3.2，要新版 bash 的测试会跳过，所以另装一个，它在 PATH 里排在 /bin 前面。
      - name: 装测试用的 shell
        run: brew install bash fish elvish nushell
      - name: 测试
        run: make test
        env:
          RUNODE_REQUIRE_SHELLS: "1"

  # 发版时 Linux 也要编出 runode（命令行和宿主），平时就在 Linux 上类型检查并 lint 全部 crate（含测试代码），
  # 免得到打标签时才发现编不过；另外跑只在 Linux 上才走得到的交接和描述符传递测试。整套测试暂时不在 Linux 上跑：
  # 其中有依赖环境的测试（真 shell、systemd、计时），还没在 Linux 上核对过。
  check-linux:
    # 发版提交只改版本号，不在 main 上重跑；发版流程对标签另查一遍，那时 ref 是标签，不受这条影响。
    if: "${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: 发布 v')) }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: 装 GPUI 编译要的库
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libssl-dev libasound2-dev libzstd-dev
      # 连 Linux 的窗口后端一起查，发版的无头包不开它。
      - name: clippy
        run: make clippy CLIPPY_ARGS="--features runode/linux-desktop -- -D warnings"
      # 交接时传描述符（MSG_NOSIGNAL、MSG_CMSG_CLOEXEC、253 个的上限）和读 /proc 判断进程死活的 Linux 分支。
      - name: Linux 专有的交接测试
        run: |
          cargo test -p runode-terminal --lib fd_passing
          cargo test -p runode-terminal --test fd_passing --test handoff
          cargo test -p runode-host --lib handoff::
          cargo test -p runode-host --test handoff
