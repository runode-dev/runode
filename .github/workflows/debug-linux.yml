name: Debug Linux handoff
on:
  push:
    branches: [debug/linux-handoff]
jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make submodules
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - run: |
          rustup toolchain install
          rustup component add clippy
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libssl-dev libasound2-dev libzstd-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: clippy
        run: make clippy CLIPPY_ARGS="-- -D warnings"
      - name: Linux 专有的交接测试
        run: |
          cargo test -p runode-terminal --lib fd_passing
          cargo test -p runode-terminal --lib pty::tests
          cargo test -p runode-terminal --test fd_passing --test handoff
          cargo test -p runode-host --lib handoff::
          cargo test -p runode-host --test handoff
