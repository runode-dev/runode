[package]
name = "runode-github-actions"
description = "The GitHub Actions page of runode's right panel: recent runs, workflows, secrets and variables through the user's gh, as a GPUI view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 面板外框、行尾按钮、就地输入框、悬停提示和共用的图标。
runode-ui.workspace = true
gpui.workspace = true
# 页上文字的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制，跟着 app 当前的语言。
rust-i18n.workspace = true
# gh 输出的 JSON，以及固定到状态栏上的工作流随窗口存档。
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
