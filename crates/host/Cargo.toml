[package]
name = "runode-host"
description = "runode's terminal host: owns the PTYs and the authoritative terminal state, one thread per session, and talks to front ends in runode-protocol messages, including git requests run in a session's repository"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-git.workspace = true
# 前端没说列哪个目录时列家目录。
runode-paths.workspace = true
runode-terminal.workspace = true
runode-protocol.workspace = true
runode-types.workspace = true
anyhow.workspace = true
# 认连上来的进程是谁（getpeereid）、拉起单独的宿主进程（posix_spawn）。
libc.workspace = true
tracing.workspace = true
# 看板的库和定时，见 `todos`。
runode-todo.workspace = true
# 会话卡片上能跑的 Makefile 目标和 package.json 的 scripts。
runode-tasks.workspace = true
# 接回任务会话时各家 agent 怎么接着上次的对话。
runode-agent.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows 10 起有的 AF_UNIX socket，前端连宿主用。
uds_windows.workspace = true
# 认连上来的进程是谁（对端进程号和它的用户 SID）、设 socket 的收发缓冲。
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
# 测试里假的旧宿主照着别的版本写交接消息，只写必填的字段；收发 `HostMsg` 和 `ClientMsg` 共用一对函数。
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# 要在没有别的线程时调 `disclaim_responsibility`，libtest 会给每个测试开线程，所以自己写 main。
[[test]]
name = "disclaim"
harness = false
