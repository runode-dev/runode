[package]
name = "runode-host"
description = "runode's terminal host: owns the PTYs and the authoritative terminal state, one thread per session, and talks to front ends in runode-protocol messages, including git requests run in a session's repository"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-git.workspace = true
# 前端没说列哪个目录时列家目录。
runode-paths.workspace = true
runode-terminal.workspace = true
runode-protocol.workspace = true
runode-shared-types.workspace = true
anyhow.workspace = true
# 读 package.json 里的 scripts，按文件里的先后列出来。
serde_json = { workspace = true, features = ["preserve_order"] }
# 锁文件（flock）和认连上来的进程是谁（getpeereid）。
libc.workspace = true
tracing.workspace = true

[lints]
workspace = true
