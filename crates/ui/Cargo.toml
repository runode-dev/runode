[package]
name = "runode-ui"
description = "GPUI widgets and helpers shared across runode's desktop views, shadcn style: theme tokens, buttons, text fields, switches, cards, badges, dialogs, popovers and menus, plus scrollbars, tooltips, font sizes, all the desktop icons (including file type icons and agent logos), system sounds and accessibility helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `display_dir` 把家目录写成 `~`，`sound::names` 找用户装的声音。
runode-paths.workspace = true
# 调色板的颜色，`hsla` 换成 GPUI 的颜色。
runode-types.workspace = true
gpui.workspace = true
tracing.workspace = true
# 输入框按字位簇挪光标、删字。
unicode-segmentation.workspace = true

# 提示音用 NSSound 按名字播放系统声音。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["std", "NSString"] }
objc2-app-kit = { workspace = true, features = ["std", "NSSound"] }

# 最大化着的窗口还原（`toggle_maximize`）：GPUI 在 Windows 上的 `zoom_window` 只会最大化。
[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
