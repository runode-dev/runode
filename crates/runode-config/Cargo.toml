[package]
name = "runode-config"
description = "runode's configuration: the Ghostty-compatible config file, bundled themes, key bindings and the config template"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-dirs.workspace = true
runode-model.workspace = true
tracing.workspace = true
# 配置模板的说明和动作说明的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制。
rust-i18n.workspace = true

# 主题还会去已安装的 Ghostty.app 里找，按 bundle id 向系统查它的位置。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { workspace = true, features = ["std", "NSWorkspace"] }

[lints]
workspace = true
