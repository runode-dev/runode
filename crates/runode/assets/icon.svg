<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#3b4766" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b4766" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS 图标网格：824×824 的圆角方块，四周留 100px -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#rim)"/>
    <rect x="114" y="114" width="796" height="796" rx="174" fill="url(#bg)"/>
    <rect x="114" y="114" width="796" height="796" rx="174" fill="url(#glow)"/>
  </g>
  <!-- 提示符 > -->
  <path d="M300 372 L470 512 L300 652" fill="none" stroke="#eef2f8" stroke-width="64"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 光标 -->
  <rect x="520" y="604" width="210" height="64" rx="32" fill="url(#cursor)"/>
  <!-- agent 状态点 -->
  <circle cx="742" cy="300" r="46" fill="#34d399"/>
  <circle cx="742" cy="300" r="46" fill="none" stroke="#0c0e14" stroke-width="14" opacity="0.35"/>
</svg>
