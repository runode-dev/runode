[package]
name = "runode"
description = "Desktop workspace for AI coding agents, built on libghostty-vt and GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-dirs.workspace = true
runode-git.workspace = true
libghostty-vt.workspace = true
gpui.workspace = true
# 不开 font-kit 时，gpui_macos 退回到空实现的文字系统，一个字形都画不出来。
gpui_platform = { workspace = true, features = ["font-kit"] }
anyhow.workspace = true
portable-pty.workspace = true
futures.workspace = true
# 读终端前台进程的名字和当前目录，作程序没设置标题时的标签名。
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 界面文字的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制。
rust-i18n.workspace = true
# 窗口布局的存档，存成 JSON。
serde.workspace = true
serde_json.workspace = true
# 右侧面板监听仓库目录，有文件变了才重读 git 状态。
notify.workspace = true
# 按 Tab 弹出的命令补全：命令规格的数据类型和动态补全的生成器。
warp-command-signatures.workspace = true
# 解压构建脚本嵌进来的命令规格。
miniz_oxide.workspace = true

[build-dependencies]
# 构建脚本把命令规格的 JSON 压紧、逐个压缩后嵌进二进制。
miniz_oxide.workspace = true
serde_json.workspace = true

# 标准「关于」面板、系统偏好的语言和窗口菜单只有 AppKit 提供，GPUI 没有封装。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSLocale", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem", "NSWorkspace", "NSEvent"] }
