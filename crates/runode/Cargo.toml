[package]
name = "runode"
description = "Desktop workspace for AI coding agents, built on libghostty-vt and GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libghostty-vt.workspace = true
gpui.workspace = true
# 不开 font-kit 时，gpui_macos 退回到空实现的文字系统，一个字形都画不出来。
gpui_platform = { workspace = true, features = ["font-kit"] }
anyhow.workspace = true
portable-pty.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
