[package]
name = "runode-cli"
description = "runode's command line front end: finds terminal sessions, reads their screens and command output, sends them text and keys, and waits for their agents and commands, over the host's Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-paths.workspace = true
# `remote pair` 配对成了以后按用户的回答在配置文件里打开 `terminal-host`。
runode-config.workspace = true
# `service` 命令：登录时自启的服务文件。
runode-autostart.workspace = true
runode-protocol.workspace = true
runode-types.workspace = true
# `remote` 命令：配对口令、设备表和监听方的状态，以及配对 URI 里的本机地址。
runode-remote.workspace = true
runode-todo.workspace = true
anyhow.workspace = true
# `wait --for text` 按正则找屏幕上的行。
regex.workspace = true
# `list --json` 的输出。
serde_json.workspace = true
# `schedule` 按本机的本地时间换算定时的钟点（`mktime`、`localtime_r`）；`remote pair` 接住信号。
libc.workspace = true
# `list`、`todo list` 这些表格按显示宽度补齐。
unicode-width.workspace = true
# `remote pair` 在终端里画配对的二维码。
qrcode.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows 10 起有的 AF_UNIX socket，连宿主用。
uds_windows.workspace = true

[lints]
workspace = true
