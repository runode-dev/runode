[package]
name = "runode-git-panel"
description = "The Git page of runode's right panel: changes by section, the commit box, branch and sync buttons, sub-repositories and worktrees, and the commit graph, running git in the background, as a GPUI view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 读到的改动、提交历史和分支，暂存、提交、同步这些操作都经它跑 git。
runode-git.workspace = true
# 提交图里 lane 的颜色。
runode-shared-types.workspace = true
# 面板的标题行和说明、菜单、按钮、徽标、提交说明框、行尾按钮、滚动条、悬停提示、文件图标和共用的图标。
runode-ui.workspace = true
gpui.workspace = true
# 页上文字的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制，跟着 app 当前的语言。
rust-i18n.workspace = true

[lints]
workspace = true
