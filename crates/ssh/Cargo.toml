[package]
name = "runode-ssh"
description = "Connect to SSH hosts with the system OpenSSH, ask for passwords through runode, and deploy runode on the remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(windows)'.dependencies]
# askpass 经 AF_UNIX 的 socket 问桌面。
uds_windows.workspace = true
# 给 ssh 接 overlapped 的管道（`process`）。
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }

[lints]
workspace = true
