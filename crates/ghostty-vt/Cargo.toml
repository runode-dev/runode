[package]
name = "runode-ghostty-vt"
description = "Safe Rust API for libghostty-vt, the Ghostty terminal emulation library"
version.workspace = true
edition.workspace = true
# 源自 libghostty-rs，沿用它的许可。
license = "MIT OR Apache-2.0"
publish.workspace = true

[lib]
# 库名沿用 libghostty_vt，文档里的示例、日志的 target 和各处的 use 都不用改。
name = "libghostty_vt"

[features]
default = ["kitty-graphics"]
allocator_api = ["dep:allocator-api2"]
kitty-graphics = ["libghostty-vt-sys/kitty-graphics"]
png = ["dep:png"]
log = ["dep:log"]
link-dynamic = ["libghostty-vt-sys/link-dynamic"]
tracing = ["dep:tracing"]

[dependencies]
allocator-api2 = { workspace = true, optional = true }
bitflags.workspace = true
libghostty-vt-sys.workspace = true
int-enum.workspace = true
png = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
