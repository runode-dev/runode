[package]
name = "runode-todo-board"
description = "runode's full-window todo board: tasks handed to agents in four columns moved by drag and drop, the schedules page and the dialog for new and edited tasks and schedules, as a GPUI view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 任务、定时和会话的数据，发给宿主的任务板请求；卡片在哪一列、拖进哪一列做什么也按它算。
runode-protocol.workspace = true
# 卡片上 agent 的状态。
runode-shared-types.workspace = true
# 新建任务时目录在 git 仓库里才默认开工作树。
runode-git.workspace = true
# 按钮、开关、输入框、对话框的面板、徽标、滚动条、悬停提示、转圈、拖动卡片和共用的图标。
runode-ui.workspace = true
gpui.workspace = true
# 页上文字的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制，跟着 app 当前的语言。
rust-i18n.workspace = true
anyhow.workspace = true
# 宿主说任务板变了的通知。
futures.workspace = true
# 定时的钟点按本机的本地时间换算（`localtime_r`、`mktime`）。
libc.workspace = true

[lints]
workspace = true
