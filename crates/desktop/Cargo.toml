[package]
name = "runode"
description = "Desktop workspace for AI coding agents, built on libghostty-vt and GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-paths.workspace = true
runode-git-status.workspace = true
runode-shared-types.workspace = true
runode-terminal.workspace = true
# 按 Tab 弹出的命令补全。
runode-completion.workspace = true
# 配置文件的读取、主题、快捷键的写法和配置模板。
runode-config.workspace = true
gpui.workspace = true
# 不开 font-kit 时，gpui_macos 退回到空实现的文字系统，一个字形都画不出来。
gpui_platform = { workspace = true, features = ["font-kit"] }
anyhow.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 界面文字的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制；配置模板的翻译在 runode-config。
rust-i18n.workspace = true
# 窗口布局的存档，存成 JSON。
serde.workspace = true
serde_json.workspace = true
# 右侧面板监听仓库目录，有文件变了才重读 git 状态。
notify.workspace = true

# 标准「关于」面板、系统偏好的语言和窗口菜单只有 AppKit 提供，GPUI 没有封装。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSLocale", "NSString"] }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem", "NSEvent"] }

[lints]
workspace = true
