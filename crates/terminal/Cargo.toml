[package]
name = "runode-terminal"
description = "Terminal sessions for runode: the libghostty-vt state machine on a shell's PTY, and shell integration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-paths.workspace = true
runode-types.workspace = true
runode-agent.workspace = true
libghostty-vt = { workspace = true, features = ["png"] }
portable-pty.workspace = true
anyhow.workspace = true
memchr.workspace = true
# 读终端前台进程的名字和当前目录，作程序没设置标题时的标签名。
libc.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# 读别的进程的父子关系、命令行和当前目录，认前台的 agent、取 shell 所在的目录；让 shell 照常处理 Ctrl+C。
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
