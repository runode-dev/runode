[package]
name = "runode-speech"
description = "Speech-to-text: downloads and verifies the recognition models, records the microphone and transcribes it on the device with sherpa-onnx, or in the cloud, and polishes the text with a language model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-types.workspace = true
anyhow.workspace = true
# 录麦克风；无头的 Linux 构建不开 `recording`，不链 ALSA 的 libasound。
cpal = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
sherpa-onnx.workspace = true
tracing.workspace = true

[features]
default = ["recording"]
# 录麦克风（`Recorder`）。不开时 `Recorder::start` 报错，可执行文件不依赖声卡的库。
recording = ["dep:cpal"]

[lints]
workspace = true
