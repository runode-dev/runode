[package]
name = "runode-preview-panel"
description = "The preview column of runode's window: file, diff and Markdown tabs with line marks, selection and word wrap, as a GPUI view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 调色板的颜色和默认的 ANSI 16 色。
runode-shared-types.workspace = true
# 读文件、判断类型、语法高亮和 Markdown 解析，不碰界面。
runode-preview.workspace = true
# 行号旁的改动标记、diff 标签读的整篇 diff。
runode-git.workspace = true
# 面板外框、菜单、标签条的部件、滚动条、悬停提示和共用的图标。
runode-ui.workspace = true
gpui.workspace = true
# 页上文字的翻译：每种语言一个 locales/<语言>.yml，编译时嵌进二进制，跟着 app 当前的语言。
rust-i18n.workspace = true
# Markdown 里网络图片的下载在后台排队，几处等同一个地址时共用一次下载。
futures.workspace = true

[lints]
workspace = true
