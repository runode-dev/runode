_version: 1
config:
  header: |-
    runode configuration file. Syntax and key names are the same as Ghostty's.
    runode reads the Ghostty configuration first, then this file; when both set a key, this file wins.
    Lines starting with ## are explanations; lines starting with a single # are commented-out defaults.
    Remove that # and change the value to apply it; the file reloads automatically when saved.
    The accepted values are described above each setting. An empty value (e.g. `background =`) restores the default.
    Colors can be #RRGGBB, #RGB (the # is optional), an X11 color name (e.g. white, dark slate gray),
    or rgb:RR/GG/BB.
  language: |-
    Interface language: %{locales}.
    Empty follows the system, and uses English when the system language has no translation.
  font_family: "Font family: the name of an installed font. Can be repeated; the first one available is used."
  font_size: "Font size: a positive number, in points."
  adjust_cell_height: "Cell height adjustment: pixels (e.g. 2, -1) or a percentage (e.g. 10%); empty means no adjustment."
  window_padding_x: "Left and right padding: one number for both sides, or left,right, in points."
  window_padding_y: "Top and bottom padding: one number for both sides, or top,bottom, in points."
  file_tree_font_size: "File tree font size: a positive number, in points."
  file_tree_preview_click: "How to open a file from the file tree in the preview pane: single (default) or double. With single, a click opens a temporary tab that the next opened file replaces, and a double-click keeps it open. With double, a double-click opens a tab that stays."
  preview_font_size: "Preview pane font size: a positive number, in points."
  theme: |-
    Theme: a theme name listed at the end of this file, or the absolute path of a theme file. It can also
    follow the system appearance, e.g. light:Catppuccin Latte,dark:Catppuccin Mocha. The theme applies first,
    and colors set below override it. Theme files in the runode/themes and ghostty/themes directories
    can be used by file name too.
  background: "Background color: a color."
  foreground: "Foreground (text) color: a color."
  cursor_color: |-
    Cursor color: a color, or cell-foreground / cell-background (follow the cell under the cursor);
    empty uses the foreground color.
  cursor_text: "Text color under a block cursor: same as above; empty uses the background color."
  selection_background: |-
    Selection background: a color, or cell-foreground / cell-background; empty uses a blue that suits
    the background.
  selection_foreground: |-
    Selection text color: same as above; when empty, uses the cell background if a selection background
    is set, and keeps the original text color otherwise.
  search_background: "Search match background: a color, or cell-foreground / cell-background."
  search_foreground: "Search match text color: same as above."
  search_selected_background: "Background of the current search match: same as above."
  search_selected_foreground: "Text color of the current search match: same as above."
  palette: "Palette: N=COLOR with N from 0 to 255, can be repeated; 0-7 are the normal colors, 8-15 the bright ones."
  cursor_style: "Cursor shape: block, bar, underline, block_hollow."
  cursor_style_blink: "Cursor blinking: true, false; empty blinks by default, and running programs can still change it."
  macos_option_as_alt: "Treat Option as Alt on macOS: true (both sides), false, left (left only), right (right only)."
  shell_integration: "Shell integration: detect (by the shell's program name), none (off), bash, zsh, fish."
  command_suggestions: "Suggest a command from the history in gray after the cursor while typing at the shell prompt; accept it with → or End, one word with Option+→. false also stops reading and recording the command history."
  command_completions: "Press Tab at the shell prompt to pick a command name, subcommand, option or argument from a menu (arguments only for commands runode has a spec for); when there is nothing to offer, Tab goes to the shell. false always sends Tab to the shell."
  agent_notifications: "Post a system notification when an agent is waiting for your answer or has finished in a split you are not looking at: true, false. Notifications only work in the packaged Runode.app."
  agent_notifications_exclude: |-
    Agents that get no notification and no sound (their marks still show): short names separated by commas,
    can be repeated; empty clears the list. Names: %{agents}.
  agent_done_sound: "Sound when an agent finishes in a split you are not looking at: a macOS system sound name (Basso, Blow, Bottle, Frog, Funk, Glass, Hero, Morse, Ping, Pop, Purr, Sosumi, Submarine, Tink), or none."
  agent_blocked_sound: "Sound when an agent waits for your answer in a split you are not looking at: same as above."
  config_file: |-
    Include another configuration file: a path, relative to this file's directory, ~/ for the home
    directory; prefix it with ? if the file may not exist. Can be repeated.
  keybind: |-
    Key bindings: TRIGGER=ACTION, can be repeated; the last line for a trigger wins.
    A trigger joins modifiers and a key with +; the modifiers are cmd, ctrl, alt, shift. Separate a key
    sequence with >, e.g. ctrl+a>n. A key is the character itself or a name such as left, right, up,
    down, page_up, page_down, home, end, enter, escape, tab, backspace, delete, space, equal, plus,
    minus, f1 to f24.
    TRIGGER=unbind removes a binding; keybind = clear removes every earlier binding, including the
    defaults below.
    Only runode's own configuration file is read for keybind; keybind in the Ghostty configuration has
    no effect.
    Default bindings:
  actions: "Available actions; ones with a parameter are written ACTION:PARAM:"
  themes: "Available themes:"
action:
  about: About runode
  quit: Quit
  open_config: Open the configuration file
  reload_config: Reload the configuration
  hide: Hide runode
  hide_others: Hide other apps
  show_all: Show all apps
  new_window: New window
  close_window: Close the window
  close_all_windows: Close all windows
  minimize: Minimize the window
  toggle_maximize: Zoom the window
  toggle_fullscreen: Toggle full screen
  new_tab: New tab
  close_tab: Close the tab
  next_tab: Next tab
  previous_tab: Previous tab
  last_tab: Last tab
  goto_tab: The Nth tab, counting from 1
  new_split: Split to the right or down
  close_surface: Close the current split, or the tab when it is the only one
  goto_split: Focus the previous, next, or adjacent split in a direction
  resize_split: Move the nearest divider in this direction by a fixed step
  equalize_splits: Make all splits the same size
  toggle_split_zoom: Zoom or restore the current split
  new_workspace: Choose a directory and open a workspace there
  close_workspace: Close the workspace and all of its tabs
  rename_workspace: Rename the workspace in the sidebar
  next_workspace: Next workspace
  previous_workspace: Previous workspace
  last_workspace: Last workspace
  goto_workspace: The Nth workspace, counting from 1
  toggle_sidebar: Show or hide the workspace sidebar
  toggle_changes: Show or hide the uncommitted changes panel on the right
  toggle_files: Show or hide the file tree on the right; double-click a file to type its path into the terminal
  goto_agent: List the agents in every window and jump to the one you pick
  next_agent: Jump to the next agent that needs you, those waiting for an answer first, then those that finished
  copy_to_clipboard: Copy
  paste_from_clipboard: Paste
  paste_from_selection: Paste the selection
  select_all: Select all
  clear_screen: Clear the screen and the scrollback
  scroll_to_top: Scroll to the top
  scroll_to_bottom: Scroll to the bottom
  scroll_page_up: Scroll up a page
  scroll_page_down: Scroll down a page
  scroll_to_selection: Scroll to the selection
  jump_to_prompt: Jump to the previous (negative) or next (positive) prompt
  text: Send text to the program; escapes such as \x1b, \n, \t, \u{...} work
  esc: Send Esc followed by the text
  csi: Send Esc [ followed by the text
  start_search: Open the search bar
  search_selection: Search for the selected text
  navigate_search: Next or previous search match
  end_search: Close the search bar
  write_screen_file: Write the screen and scrollback to a temporary file, then copy its path, paste its path, or open it
  increase_font_size: Increase the font size by a fixed step; N can be omitted
  decrease_font_size: Decrease the font size by a fixed step; N can be omitted
  reset_font_size: Reset the font size
