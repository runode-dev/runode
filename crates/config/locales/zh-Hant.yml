_version: 1
config:
  header: |-
    runode 設定檔，語法和鍵名與 Ghostty 相同。
    runode 先讀 Ghostty 的設定，再讀這個檔案；同一個鍵以這裡為準。
    ## 開頭的是說明；一個 # 開頭的是註解掉的預設值，去掉這個 # 再改值才生效，儲存後自動重新載入。
    每一項上面寫了能填的值。值留空（例如 `background =`）表示恢復預設。
    顏色可以寫 #RRGGBB、#RGB（# 可省略）、X11 顏色名稱（例如 white、dark slate gray），
    或 rgb:RR/GG/BB。
  language: |-
    介面語言：%{locales}。
    留空時跟隨系統，系統語言沒有翻譯時用英文。
  font_family: 字型：已安裝字型的名稱，可以寫多行，第一個能用的生效。
  font_size: 字級：正數，單位是點。
  adjust_cell_height: 字元格高度的調整量：像素（例如 2、-1）或百分比（例如 10%），留空表示不調整。
  window_padding_x: 左右內距：一個數表示兩邊相同，或寫成 左,右，單位是點。
  window_padding_y: 上下內距：一個數表示兩邊相同，或寫成 上,下，單位是點。
  window_style: 視窗的樣子：cards（卡片，預設）或 classic（經典）。cards 時每個分割畫面和右側面板各是一張帶標題列的圓角卡片，襯在深一階的外框上，標題列顯示這台 Mac 的名稱和膠囊樣式的分頁；classic 時終端機鋪滿視窗，分割畫面之間一條細線。
  file_tree_font_size: 右側檔案樹的字級：正數，單位是點。
  file_tree_preview_click: 檔案樹裡怎樣在預覽欄開啟檔案：single（按一下，預設）或 double（按兩下）。single 時按一下開成暫時分頁，再開啟別的檔案時會被換掉，按兩下則固定下來；double 時按兩下開成固定分頁。
  preview_font_size: 預覽欄的字級：正數，單位是點。
  theme: |-
    主題：檔案末尾列出的主題名稱，或主題檔案的絕對路徑；也可以依系統外觀分開寫，
    例如 light:Catppuccin Latte,dark:Catppuccin Mocha。主題會先生效，下面寫出的顏色再覆蓋它。
    runode/themes、ghostty/themes 兩個目錄裡的主題檔案也能用，依檔名引用。
  background: 背景色：顏色。
  foreground: 前景色（文字的顏色）：顏色。
  cursor_color: 游標顏色：顏色，或 cell-foreground、cell-background（跟隨游標所在格子）；留空時用前景色。
  cursor_text: 區塊游標下文字的顏色：同上；留空時用背景色。
  selection_background: 選取範圍底色：顏色，或 cell-foreground、cell-background；留空時依背景深淺用一種藍色。
  selection_foreground: 選取範圍文字顏色：同上；留空時設了選取底色就用格子的背景色，沒設就保持文字原本的顏色。
  search_background: 搜尋符合項目的底色：顏色，或 cell-foreground、cell-background。
  search_foreground: 搜尋符合項目的文字顏色：同上。
  search_selected_background: 目前選中的搜尋符合項目的底色：同上。
  search_selected_foreground: 目前選中的搜尋符合項目的文字顏色：同上。
  palette: 調色盤：序號=顏色，序號為 0 到 255，可以寫多行；0-7 是一般色，8-15 是亮色。
  cursor_style: 游標形狀：block、bar、underline、block_hollow。
  cursor_style_blink: 游標是否閃爍：true、false（預設，游標常亮不閃）；執行中的程式仍可打開或關掉閃爍。
  cursor_style_blink_timeout: 游標閃爍時，這麼多秒沒有鍵盤輸入、終端沒有輸出、視窗也沒有重新取得焦點，就停止閃爍、游標常亮，有了其中任何一樣就立刻恢復閃爍。0 表示一直閃。
  macos_option_as_alt: macOS 上把 Option 當作 Alt：true（兩邊都是）、false、left（只有左邊）、right（只有右邊）。
  scrollback_limit: 每個終端的捲動歷史最多佔多少位元組：非負整數，小於 2 MiB（2097152）時按 2 MiB 算。另外最多留 1 萬行，先到哪個上限就按哪個算。改了對已經開著的終端也生效。
  shell_integration: Shell 整合：detect（依 shell 的程式名稱判斷）、none（關閉）、bash、zsh、fish。
  command_suggestions: 在 shell 提示字元上輸入時，依指令歷史在游標後用灰字給出建議，按 → 或 End 接受，Option+→ 接受一個詞。false 時也不讀寫指令歷史。
  command_highlighting: 在 shell 提示字元上輸入時替指令列上色：指令、關鍵字、選項、字串、變數、存在的路徑各有顏色，找不到的指令標紅，顏色參照 zsh 外掛 fast-syntax-highlighting、取自主題的調色盤。shell 自己已經上了色（裝了高亮外掛）時不管。
  clipboard_write: 終端機裡的程式用 OSC 52 寫入系統剪貼簿時（vim、tmux 和經 ssh 連到遠端的 shell 都這樣複製）：allow 照寫，deny 丟掉。ask 還不支援，當作 deny。
  clipboard_read: 終端機裡的程式用 OSC 52 讀取剪貼簿時：ask 先跳出對話框說明是哪個終端機、哪個程式要讀，你同意了才給；allow 不問直接給；deny 回給程式一個空的剪貼簿。剪貼簿裡可能有密碼，只對信得過的程式用 allow。
  terminal_host: 終端機工作階段放在單獨的背景程序裡：true、false。true 時結束 Runode 後工作階段照常執行，下次開啟接著用；false 時工作階段跟著 app 一起結束。只在 Runode 啟動時讀取，改了下次啟動才生效。背景還有工作階段時改成 false，下次啟動仍會接回這些工作階段，那次結束時才結束它們。
  remote_access: 讓手機經區域網路或 Tailscale 連上這台 Mac 的終端機：true、false。用 runode remote pair 為手機配對，runode remote devices 列出配對過的手機，runode remote revoke 撤銷一台。改了幾秒內生效，不必重新啟動 Runode。
  remote_access_port: 遠端存取在所有網路介面上監聽的 TCP 連接埠：1 到 65535。
  command_completions: 在 shell 提示字元上按 Tab 時從選單裡選指令名稱、子指令、選項或參數（參數只限 runode 認得的指令），沒有可選的時 Tab 照常交給 shell。false 時 Tab 總是交給 shell。
  agent_notifications: agent 在你沒在看的分割畫面裡等你回答或者做完了時，發系統通知：true、false。只有打包好的 Runode.app 能發通知。
  agent_notifications_exclude: |-
    不發通知也不出提示音的 agent（狀態標記照常顯示）：用逗號隔開的短名，可以寫多行，值為空時清空。
    可用的短名：%{agents}。
  agent_done_sound: agent 在你沒在看的分割畫面裡做完了時的提示音：macOS 的系統聲音名稱（Basso、Blow、Bottle、Frog、Funk、Glass、Hero、Morse、Ping、Pop、Purr、Sosumi、Submarine、Tink），none 表示不出聲。
  agent_blocked_sound: agent 在你沒在看的分割畫面裡等你回答時的提示音：同上。
  config_file: |-
    引入別的設定檔：檔案路徑，相對路徑從這個檔案所在目錄算，~/ 表示家目錄；
    路徑前加 ? 表示檔案可以不存在。可以寫多行。
  keybind: |-
    快速鍵：觸發鍵=動作，可以寫多行，同一個觸發鍵以最後一行為準。
    觸發鍵由修飾鍵和按鍵用 + 連起來，修飾鍵有 cmd、ctrl、alt、shift；連按幾個鍵用 > 隔開，
    例如 ctrl+a>n。按鍵寫字元本身，或 left、right、up、down、page_up、page_down、home、end、
    enter、escape、tab、backspace、delete、space、equal、plus、minus、f1 到 f24 等名稱。
    觸發鍵=unbind 去掉一個綁定；keybind = clear 去掉之前的全部綁定，包括下面的預設綁定。
    這裡只認 runode 自己的設定檔，Ghostty 設定裡的 keybind 不生效。
    預設綁定：
  actions: 可用的動作，帶參數的寫成 動作:參數：
  themes: 可用的主題：
action:
  about: 關於 runode
  quit: 結束
  open_settings: 打開設定
  open_config: 打開設定檔
  reload_config: 重新載入設定
  hide: 隱藏 runode
  hide_others: 隱藏其他應用程式
  show_all: 顯示全部應用程式
  new_window: 新增視窗
  close_window: 關閉視窗
  close_all_windows: 關閉所有視窗
  minimize: 將視窗縮到最小
  toggle_maximize: 縮放視窗
  toggle_fullscreen: 切換全螢幕
  new_tab: 新增分頁
  close_tab: 關閉分頁
  next_tab: 下一個分頁
  previous_tab: 上一個分頁
  last_tab: 最後一個分頁
  goto_tab: 第 N 個分頁，從 1 數
  new_split: 向右或向下分割
  close_surface: 關閉目前的分割畫面，分頁裡只剩它時關閉分頁
  goto_split: 焦點移到上一個、下一個或某個方向上的分割畫面
  resize_split: 把最近的分隔線往這個方向移，步長固定
  equalize_splits: 平均分割畫面
  toggle_split_zoom: 放大或還原目前的分割畫面
  arrange_splits: 在目前的分割畫面旁一次開出幾個新終端機，先選方向和個數
  new_workspace: 選一個目錄，在裡面新增工作區
  close_workspace: 關閉工作區和裡面所有分頁
  rename_workspace: 在側欄裡重新命名工作區
  next_workspace: 下一個工作區
  previous_workspace: 上一個工作區
  last_workspace: 最後一個工作區
  goto_workspace: 第 N 個工作區，從 1 數
  toggle_sidebar: 顯示或隱藏工作區側欄
  toggle_git: 顯示或隱藏右側的 Git 面板：暫存、提交、切換分支、同步和儲藏
  toggle_files: 顯示或隱藏右側的檔案樹，按兩下檔案把路徑打進終端機
  goto_agent: 列出所有視窗裡的 agent，選一個跳過去
  next_agent: 跳到下一個要處理的 agent：先是等你回答的，再是做完了還沒看的
  copy_to_clipboard: 拷貝
  paste_from_clipboard: 貼上
  paste_from_selection: 貼上選取內容
  select_all: 全選
  clear_screen: 清除螢幕並清掉捲動歷史
  scroll_to_top: 捲到最上面
  scroll_to_bottom: 捲到最下面
  scroll_page_up: 向上捲一頁
  scroll_page_down: 向下捲一頁
  scroll_to_selection: 捲到選取範圍
  jump_to_prompt: 跳到上一個（負數）或下一個（正數）提示符號
  text: 把文字傳給程式，支援 \x1b、\n、\t、\u{...} 等跳脫字元
  esc: 傳送 Esc 加文字
  csi: 傳送 Esc [ 加文字
  start_search: 打開搜尋列
  search_selection: 用選取的文字搜尋
  navigate_search: 下一個或上一個搜尋結果
  end_search: 關閉搜尋列
  write_screen_file: 把螢幕和捲動歷史寫進暫存檔，再拷貝路徑、貼上路徑或打開它
  increase_font_size: 放大字體，步長固定，N 可省略
  decrease_font_size: 縮小字體，步長固定，N 可省略
  reset_font_size: 重設字體大小
