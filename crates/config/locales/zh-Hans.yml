_version: 1
config:
  header: |-
    Runode 配置文件，语法和键名与 Ghostty 相同。
    Runode 先读 Ghostty 的配置，再读这个文件；同一个键以这里为准。
    ## 开头的是说明；一个 # 开头的是注释掉的默认值，去掉这个 # 再改值才生效，保存后自动重载。
    每一项上面写了能填的值。值留空（比如 `background =`）表示恢复默认。
    颜色可以写 #RRGGBB、#RGB（# 可省略）、X11 颜色名（比如 white、dark slate gray），
    或 rgb:RR/GG/BB。
  language: |-
    界面语言：%{locales}。
    留空时跟随系统，系统语言没有翻译时用英文。
  font_family: 字体族：已安装字体的名字，可以写多行，第一个能用的生效。
  font_size: 字号：正数，单位是点。
  adjust_cell_height: 单元格高度的调整量：像素（比如 2、-1）或百分比（比如 10%），留空表示不调整。
  window_padding_x: 左右内边距：一个数表示两边相同，或者写成 左,右，单位是点。
  window_padding_y: 上下内边距：一个数表示两边相同，或者写成 上,下，单位是点。
  window_style: 窗口的样子：cards（卡片，默认）或 classic（经典）。cards 时每个分屏和右侧面板各是一张带标题条的圆角卡片，衬在深一档的外框上，标题栏显示这台 Mac 的名字和胶囊样式的标签；classic 时终端铺满窗口，分屏之间一条细线。
  status_bar: 显示窗口底部的状态栏：true（默认）或 false。也可以从「显示」菜单或状态栏的右键菜单切换。
  status_bar_hidden: 窗口底部状态栏上不显示的几块：sleep（防止休眠）、resources（内存和终端数）、ports（端口），用逗号隔开，可以写多行，值为空时全都显示。也可以在状态栏上右键勾选。
  file_tree_font_size: 右侧文件树的字号：正数，单位是点。
  file_tree_preview_click: 文件树里怎样在预览栏打开文件：single（单击，默认）或 double（双击）。single 时单击开成临时标签，再打开别的文件时被换掉，双击固定下来；double 时双击开成固定标签。
  preview_font_size: 预览栏的字号：正数，单位是点。
  task_placement: 标题栏命令菜单里点了一条命令时在哪跑它：right（默认）、down 或 tab。right、down 在当前标签里把当前终端分开，新终端放在右边或下边；tab 在当前标签右边开一个新标签。
  theme: |-
    主题：文件末尾列出的主题名，或者主题文件的绝对路径；还可以按系统外观分开写，
    比如 light:Catppuccin Latte,dark:Catppuccin Mocha。主题会先生效，下面写出的颜色再覆盖它。
    runode/themes、ghostty/themes 两个目录里的主题文件也能用，按文件名引用。
  background: 背景色：颜色。
  foreground: 前景色（文字的颜色）：颜色。
  cursor_color: 光标颜色：颜色，或 cell-foreground、cell-background（跟随光标所在格子）；留空时用前景色。
  cursor_text: 块状光标下文字的颜色：同上；留空时用背景色。
  selection_background: 选区底色：颜色，或 cell-foreground、cell-background；留空时按背景深浅用一种蓝色。
  selection_foreground: 选区文字颜色：同上；留空时配了选区底色就用格子的背景色，没配就保持文字原来的颜色。
  search_background: 搜索匹配的底色：颜色，或 cell-foreground、cell-background。
  search_foreground: 搜索匹配的文字颜色：同上。
  search_selected_background: 当前选中的搜索匹配的底色：同上。
  search_selected_foreground: 当前选中的搜索匹配的文字颜色：同上。
  palette: 调色板：序号=颜色，序号为 0 到 255，可以写多行；0-7 是普通色，8-15 是亮色。
  cursor_style: 光标形状：block、bar、underline、block_hollow。
  cursor_style_blink: 光标是否闪烁：true、false（默认，光标常亮不闪）；运行中的程序仍可打开或关掉闪烁。
  cursor_style_blink_timeout: 光标闪烁时，这么多秒没有键盘输入、终端没有输出、窗口也没有重新获得焦点，就停止闪烁、光标常亮，有了其中任何一样就立刻恢复闪烁。0 表示一直闪。
  macos_option_as_alt: macOS 上把 Option 当作 Alt：true（两边都是）、false、left（只有左边）、right（只有右边）。
  scrollback_limit: 每个终端的回滚历史最多占多少字节：非负整数，小于 2 MiB（2097152）时按 2 MiB 算。另外最多留 1 万行，先到哪个上限就按哪个算。改了对已经开着的终端也生效。
  shell_integration: shell 集成：detect（按 shell 的程序名判断）、none（关闭）、bash、zsh、fish。
  shell_integration_features: shell 集成另外做的事，写法同 Ghostty：cursor（默认）在提示符上把光标换成竖线，zsh 的 vi 命令模式里是方块，跑命令时恢复成 cursor-style；no-cursor 不改光标。竖线闪不闪跟 cursor-style-blink。Ghostty 的 sudo、title、ssh-env、ssh-terminfo、path 也认，但不起作用。只对之后新开的 shell 生效。
  command_suggestions: 在 shell 提示符上输入时，按命令历史在光标后用灰字给出建议，按 → 或 End 接受，Option+→ 接受一个词。false 时也不读写命令历史。
  command_highlighting: 在 shell 提示符上输入时给命令行上色：命令、关键字、选项、字符串、变量、存在的路径各有颜色，找不到的命令标红，颜色参照 zsh 插件 fast-syntax-highlighting、取自主题的调色板。shell 自己已经上了色（装了高亮插件）时不管。
  clipboard_write: 终端里的程序用 OSC 52 写系统剪贴板时（vim、tmux 和经 ssh 连到远端的 shell 都这样复制）：allow 照写，deny 丢掉。ask 还不支持，按 deny 办。
  clipboard_read: 终端里的程序用 OSC 52 读剪贴板时：ask 先弹框说明是哪个终端、哪个程序要读，你同意了才给；allow 不问直接给；deny 回给程序一个空的剪贴板。剪贴板里可能有密码，只对信得过的程序用 allow。
  terminal_host: 终端会话放在单独的后台进程里：true、false。true 时退出 Runode 后会话照常运行，下次打开接着用；false 时会话跟着 app 一起结束。只在 Runode 启动时读，改了下次启动才生效。后台还有会话时改成 false，下次启动仍会接回这些会话，那次退出时才结束它们。
  auto_update: 启动后和之后每隔几个小时查一次 Runode 的新版本：true、false。true 时有了新版本就在后台下载好，退出 Runode 时装上；false 时只在 Runode 菜单里点「检查更新…」时查。只有发布者签过名的 Runode.app 会自己更新。
  remote_access: 让手机经局域网或 Tailscale 连上这台 Mac 的终端：true、false。用 runode remote pair 给手机配对，runode remote devices 列出配对过的手机，runode remote revoke 撤销一台。改了几秒内生效，不用重启 Runode。
  remote_access_port: 远程访问在所有网卡上监听的 TCP 端口：1 到 65535。
  remote_access_name: 配对过的手机上显示的这台电脑的名字，留空时用「系统设置 › 通用 › 共享」里的电脑名。改了几秒内生效，连着的手机会断开一下再自己连上。
  remote_access_push: agent 等你回答时，在配对过的手机上用实时活动（灵动岛和锁屏）显示出来，手机上的 Runode 没开着也行：true、false。手机连上时自己登记；官方 App 的推送经推送中转发，自己编译签名的 App 要配下面的 apns-* 几项。
  remote_access_push_text: 实时活动里带上屏幕底部的问题和选项：true、false。false 时只发标题和 agent。
  remote_access_push_delay: agent 等回答过了这么多秒还在等才推到手机上，在电脑前很快答了的不打扰手机：整数，0 是马上推。
  apns_key_file: 自己签名的 App 不经中转、直接推给 Apple：Apple 开发者账号里下载的 .p8 密钥文件，~/ 表示家目录。和 apns-key-id、apns-team-id、apns-bundle-id 都配了才用。
  apns_key_id: 这把密钥的 ID（10 个字符，也在文件名 AuthKey_<ID>.p8 里）。
  apns_team_id: Apple 开发者账号的 Team ID（10 个字符）。
  apns_bundle_id: 自己编译的手机 App 的 bundle ID；这个 App 的登记用上面的密钥推。
  push_relay_url: 给官方手机 App 发推送的中转服务：https:// 开头的网址。
  command_completions: 在 shell 提示符上按 Tab 时从菜单里选命令名、子命令、选项或参数（参数只限 Runode 认识的命令），没有可选的时 Tab 照常交给 shell。false 时 Tab 总是交给 shell。
  agent_notifications: agent 在你没在看的分屏里等你回答或者干完了时，发系统通知：true、false。只有打包好的 Runode.app 能发通知。
  agent_notifications_exclude: |-
    不发通知也不出提示音的 agent（状态标记照常显示）：用逗号隔开的短名，可以写多行，值为空时清空。
    可用的短名：%{agents}。
  agent_done_sound: agent 在你没在看的分屏里干完了时的提示音：macOS 的系统声音名（Basso、Blow、Bottle、Frog、Funk、Glass、Hero、Morse、Ping、Pop、Purr、Sosumi、Submarine、Tink），none 表示不出声。
  agent_blocked_sound: agent 在你没在看的分屏里等你回答时的提示音：同上。
  config_file: |-
    引入别的配置文件：文件路径，相对路径从这个文件所在目录算，~/ 表示主目录；
    路径前加 ? 表示文件可以不存在。可以写多行。
  keybind: |-
    快捷键：触发键=动作，可以写多行，同一个触发键以最后一行为准。
    触发键由修饰键和按键用 + 连起来，修饰键有 cmd、ctrl、alt、shift；连按几个键用 > 隔开，
    比如 ctrl+a>n。按键写字符本身，或者 left、right、up、down、page_up、page_down、home、end、
    enter、escape、tab、backspace、delete、space、equal、plus、minus、f1 到 f24 等名字。
    按键写 digit 时一行顶九行，数字 1 到 9 各绑一次；goto_tab、goto_workspace 不带参数时按几就去第几个，
    9 是最后一个，比如 cmd+digit=goto_tab。
    触发键=unbind 去掉一个绑定；keybind = clear 去掉之前的全部绑定，包括下面的默认绑定。
    这里只认 Runode 自己的配置文件，Ghostty 配置里的 keybind 不生效。
    默认绑定：
  actions: 可用的动作，带参数的写成 动作:参数：
  themes: 可用的主题：
action:
  about: 关于 Runode
  quit: 退出
  open_settings: 打开设置
  open_config: 打开配置文件
  reload_config: 重新加载配置
  hide: 隐藏 Runode
  hide_others: 隐藏其他应用
  show_all: 显示全部应用
  new_window: 新建窗口
  close_window: 关闭窗口
  close_all_windows: 关闭全部窗口
  minimize: 最小化窗口
  toggle_maximize: 缩放窗口
  toggle_fullscreen: 切换全屏
  new_tab: 新建标签
  close_tab: 关闭标签
  next_tab: 下一个标签
  previous_tab: 上一个标签
  last_tab: 最后一个标签
  goto_tab: 第 N 个标签，从 1 数
  new_split: 向右或向下分屏
  close_surface: 关闭当前分屏，标签里只剩它时关闭标签
  goto_split: 焦点移到上一个、下一个或某个方向上的分屏
  resize_split: 把最近的分隔线往这个方向挪，步长固定
  equalize_splits: 均分分屏
  toggle_split_zoom: 放大或还原当前分屏
  arrange_splits: 在当前分屏旁边一次开出几个新终端，先选方向和个数
  new_workspace: 选一个目录，在里面新建工作区
  close_workspace: 关闭工作区和里面所有标签
  rename_workspace: 在侧栏里重命名工作区
  next_workspace: 下一个工作区
  previous_workspace: 上一个工作区
  last_workspace: 最后一个工作区
  goto_workspace: 第 N 个工作区，从 1 数
  toggle_sidebar: 显示或隐藏工作区侧栏
  toggle_status_bar: 显示或隐藏窗口底部的状态栏
  toggle_git: 显示或隐藏右侧的 Git 面板：暂存、提交、切换分支、同步和储藏
  toggle_files: 显示或隐藏右侧的文件树，双击文件把路径打进终端
  toggle_simulator: 显示或隐藏右侧的模拟器页：经 mobilecli 看和操作 iOS 模拟器、Android 模拟器的实时画面
  toggle_tasks: 打开或关掉标题栏上的项目命令菜单，上下键选、回车运行
  run_task: 跑项目命令菜单里叫这个名字的命令（自己加的、Makefile 目标或 package.json 的 script），和在菜单里点它一样；同名的取菜单里靠上的
  goto_agent: 列出所有窗口里的 agent，选一个跳过去
  next_agent: 跳到下一个要处理的 agent：先是等你回答的，再是干完了还没看的
  copy_to_clipboard: 复制
  paste_from_clipboard: 粘贴
  paste_from_selection: 粘贴选区
  select_all: 全选
  clear_screen: 清屏并清掉回滚历史
  reload_shell: 把停在提示符上的 shell 换成一个新的，重新读 shell 配置，集成照旧
  scroll_to_top: 滚到顶部
  scroll_to_bottom: 滚到底部
  scroll_page_up: 向上翻页
  scroll_page_down: 向下翻页
  scroll_to_selection: 滚到选区
  jump_to_prompt: 跳到上一个（负数）或下一个（正数）提示符
  text: 把文本发给程序，支持 \x1b、\n、\t、\u{...} 等转义
  esc: 发送 Esc 加文本
  csi: 发送 Esc [ 加文本
  start_search: 打开搜索栏
  search_selection: 用选区的文字搜索
  navigate_search: 下一个或上一个搜索匹配
  end_search: 关闭搜索栏
  write_screen_file: 把屏幕和回滚历史写进临时文件，再复制路径、粘贴路径或打开它
  increase_font_size: 放大字号，步长固定，N 可省略
  decrease_font_size: 缩小字号，步长固定，N 可省略
  reset_font_size: 恢复默认字号
