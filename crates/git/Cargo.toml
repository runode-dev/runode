[package]
name = "runode-git"
description = "A project's git through the git command line: reads status, line-level changes, branches, stashes and the commit graph, and stages (also by hunk), discards, commits, switches branches, stashes and syncs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, optional = true }

[features]
# 桌面经 ssh 在远端读项目时，两边按 JSON 收发这些类型。
serde = ["dep:serde"]

[lints]
workspace = true
