[package]
name = "runode-screen"
description = "Remote desktop on the computer side: captures a display, encodes it as low-latency hardware HEVC, and injects the mouse and keyboard input sent from the phone"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-types.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSError", "NSString"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGSession", "CGWindow", "libc"] }
objc2-core-media = { workspace = true, features = ["std", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { workspace = true, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-video-toolbox = { workspace = true, features = ["std", "objc2-core-media", "objc2-core-video", "VTBase", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession"] }
objc2-screen-capture-kit = { workspace = true, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics", "SCShareableContent", "SCStream"] }
block2.workspace = true
dispatch2 = { workspace = true, features = ["std", "alloc", "objc2"] }

[lints]
workspace = true
