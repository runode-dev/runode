[package]
name = "runode-remote"
description = "runode's remote access: a TLS 1.3 listener with a pairing and signature gate that bridges phones to the terminal host, plus pairing codes, the paired device table and Bonjour discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
runode-paths.workspace = true
runode-protocol.workspace = true
# 推送时看会话的 agent 是不是在等回答（`SessionMeta`、`AgentState`）。
runode-types.workspace = true
# keepalive 和 IPv6 的监听（绑定前设 IPV6_V6ONLY）。
socket2.workspace = true
serde.workspace = true
# 设备表、配对口令和监听方状态的文件是 JSON。
serde_json.workspace = true
tracing.workspace = true
rustls.workspace = true
rcgen.workspace = true
ring.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# 枚举本机地址（getifaddrs）、主机名、poll，以及 socket2 没有的 TCP 选项。
libc.workspace = true

[target.'cfg(windows)'.dependencies]
uds_windows.workspace = true
# 枚举本机地址（GetAdaptersAddresses）、主机名、WSAPoll，以及 socket2 没有的 TCP 选项。
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
] }

[lints]
workspace = true
