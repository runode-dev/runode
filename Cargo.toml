[workspace]
resolver = "3"
members = ["crates/*"]
# 不带 -p 的 cargo 命令覆盖全部 crate。
default-members = ["crates/*"]
# vendor/libghostty-rs 自成一个 workspace；不排除的话，根目录下的 path 依赖
# 会被自动收编为本 workspace 的成员。
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
runode-dirs = { path = "crates/runode-dirs" }
runode-model = { path = "crates/runode-model" }
runode-git = { path = "crates/runode-git" }
runode-term = { path = "crates/runode-term" }
runode-completion = { path = "crates/runode-completion" }
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }
anyhow = "1"
portable-pty = "0.9"
futures = "0.3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
# 命令补全的规格库（MIT）。不开 embed-signatures：那会把整个 JSON 目录原样编进二进制，
# 规格数据改由构建脚本压缩后嵌入。
warp-command-signatures = { path = "vendor/command-signatures/command-signatures", default-features = false }
miniz_oxide = "0.9"

[profile.dev.package."*"]
opt-level = 2

# block 0.1.6 已停止维护，新版 Rust 拒绝用空 enum 作外部 static 的类型，并对没写 ABI 的
# extern 报弃用警告；用修好这两点的副本替换。GPUI 的 macOS 后端经 cocoa、metal、core-video
# 的最新版仍依赖 block 0.1，等它们不再依赖或 block 出修复版，再删掉这段 patch 和副本。
[patch.crates-io]
block = { path = "vendor/crates/block" }
