[workspace]
resolver = "3"
# apps/ 下不全是 Rust 项目（以后的手机端是各平台自己的工程），桌面 app 单独列出。
members = ["crates/*", "apps/desktop"]
# 不带 -p 的 cargo 命令覆盖全部 crate。
default-members = ["crates/*", "apps/desktop"]
# vendor/libghostty-rs 自成一个 workspace；不排除的话，根目录下的 path 依赖
# 会被自动收编为本 workspace 的成员。
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
runode-paths = { path = "crates/paths" }
runode-shared-types = { path = "crates/shared-types" }
runode-protocol = { path = "crates/protocol" }
runode-git = { path = "crates/git" }
runode-terminal = { path = "crates/terminal" }
runode-host = { path = "crates/host" }
runode-cli = { path = "crates/cli" }
runode-completion = { path = "crates/completion" }
runode-prompt-highlight = { path = "crates/prompt-highlight" }
runode-config = { path = "crates/config" }
runode-preview = { path = "crates/preview" }
runode-agent-detect = { path = "crates/agent-detect" }
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }
anyhow = "1"
portable-pty = "0.9"
futures = "0.3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
notify = "8"
# 命令补全的规格库（MIT）。不开 embed-signatures：那会把整个 JSON 目录原样编进二进制，
# 规格数据改由构建脚本压缩后嵌入。
warp-command-signatures = { path = "vendor/command-signatures/command-signatures", default-features = false }
miniz_oxide = "0.9"
# agent 识别规则的格式（TOML）和规则里的正则。
regex = "1"
toml = "1"
# 文件预览的语法高亮（MIT）。只开解析和纯 Rust 的 fancy-regex 正则后端，不链接 C 库；
# 语法定义取自 two-face（MIT 或 Apache-2.0），它的正则后端特性要和这里一致。
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# AppKit 和 Foundation 的绑定，只在 macOS 上用。不要默认特性，各 crate 按用到的类型自己开。
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }

[profile.dev.package."*"]
opt-level = 2

# 发布构建。下面的数字在 M5 Max 上量，启动和内存用性能测量脚本（每个二进制 5 轮取中位数），
# 体积是 runode 二进制的字节数，构建时间是从空的 target 目录开始的整次构建（受机器当时的负载
# 影响，只看量级）。
[profile.release]
# 不用 "s" 或 "z"：libghostty-vt-sys 的构建脚本看到 OPT_LEVEL 是 s 或 z，会把 libghostty 换成
# ReleaseSmall 构建。
opt-level = 3
# 不能 abort：宿主的会话线程（`Runner::run`）靠 catch_unwind 兜住单个会话处理消息时的 panic，
# 只结束那一个会话，abort 会连整个 app 一起带走。
panic = "unwind"
# 各方案实测（体积 / 整次构建 / 只改桌面 crate 后重建）：
#   不开 LTO（原来的默认）       29.45 MiB /  66 秒 / 13.5 秒
#   thin LTO                    29.40 MiB /  61 秒 / —
#   thin LTO，codegen-units=1   24.91 MiB /  90 秒 / 39 秒
#   fat LTO                     23.51 MiB / 136 秒 / —
#   fat LTO，codegen-units=1    22.87 MiB / 147 秒 / 109 秒
# 开窗时间（中位数在首次和第二次启动都是 185～212 毫秒）、启动各节点、RSS（150～152 MiB）、宿主
# 的按键回显延迟和吞吐，各方案的差别都在测量的抖动以内，所以只比体积和构建时间。fat LTO 比 thin
# 只再小 2 MiB，改一点代码后的重建却要 109 秒，是 thin 的近 3 倍，选 thin LTO 加 codegen-units=1。
lto = "thin"
codegen-units = 1
# 只去掉调试信息，留着符号表（不写时发布构建也是这样）。改成 "symbols" 再小约 3.5 MiB（fat LTO
# 那份从 22.87 到 19.36 MiB），但 RUST_BACKTRACE 打出的 panic 回溯一帧函数名都没有了，系统的
# 崩溃报告里也只剩地址；panic 的消息和源码位置不靠符号表，两种都还在。
strip = "debuginfo"

# block 0.1.6 已停止维护，新版 Rust 拒绝用空 enum 作外部 static 的类型，并对没写 ABI 的
# extern 报弃用警告；用修好这两点的副本替换。GPUI 的 macOS 后端经 cocoa、metal、core-video
# 的最新版仍依赖 block 0.1，等它们不再依赖或 block 出修复版，再删掉这段 patch 和副本。
#
# gpui-pre-apple 是 GPUI 的 Metal 渲染器（`MetalRenderer`），上游的写法按 Zed 那种大窗口、常画矢量
# 图形的编辑器取舍，对终端多占显存；用副本改两处省内存，其余和 crates.io 上的 0.3.7 一字不差：
#   - 窗口层（CAMetalLayer）的 drawable 最多 2 个，上游是 3 个。每个 drawable 和窗口一样大，
#     默认窗口在 Retina 屏上每个约 9 MiB，全屏 5K 约 56 MiB。代价是 GPU 赶不上时主线程在
#     nextDrawable 上多等一帧。
#   - 画 path 用的整窗大小的中间纹理（`path_intermediate_texture`，连同 MSAA 那张）等第一次真要
#     画 path 时才建，尺寸变了先作废、用到时再按新尺寸建；上游每次改尺寸都无条件建。runode 只有
#     终端里 Powerline 这类多边形字符会画 path，不用这些字符时一直省着这张纹理。
# 副本的第一个提交是从 crates.io 下的原样文件（只少了 cargo 解包时写的 .cargo-ok），改动都在后面的
# 提交里，每处加了注释。升级 GPUI 时：gpui-pre 的版本写死，版本号变了这段 patch 就对不上新版本
# （cargo 会警告 patch 没用上），要把新版的 gpui-pre-apple 原样复制进来单独提交，再看上游有没有
# 做同样的事，没有就把副本自己的改动（对着原样提交的 git diff）补上；上游都改了就删掉副本和这一行。
[patch.crates-io]
block = { path = "vendor/crates/block" }
gpui-pre-apple = { path = "vendor/crates/gpui-pre-apple" }

# 只开现有代码已经满足的规则，防着以后倒退；新加规则时先把代码改干净。
[workspace.lints.rust]
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
# 调试用的宏和占位不留在代码里。
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# 输出一律走 tracing；构建脚本不受这两条限制。以后加命令行程序时在它自己的 crate 里放开。
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
mut_mut = "warn"
ptr_as_ptr = "warn"
ref_option_ref = "warn"
wildcard_imports = "warn"
