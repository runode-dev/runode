[workspace]
resolver = "3"
members = ["crates/runode"]
default-members = ["crates/runode"]
# vendor/libghostty-rs 自成一个 workspace；不排除的话，根目录下的 path 依赖
# 会被自动收编为本 workspace 的成员。
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7" }
anyhow = "1"
portable-pty = "0.9"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
