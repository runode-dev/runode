[workspace]
resolver = "3"
# apps/ 下不全是 Rust 项目（以后的手机端是各平台自己的工程），桌面 app 单独列出。
members = ["crates/*", "apps/desktop"]
# 不带 -p 的 cargo 命令覆盖全部 crate。
default-members = ["crates/*", "apps/desktop"]
# vendor 下的依赖不是本 workspace 的成员；不排除的话，根目录下的 path 依赖
# 会被自动收编为本 workspace 的成员。
exclude = ["vendor"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
runode-paths = { path = "crates/paths" }
runode-shared-types = { path = "crates/shared-types" }
runode-protocol = { path = "crates/protocol" }
runode-git = { path = "crates/git" }
runode-terminal = { path = "crates/terminal" }
runode-host = { path = "crates/host" }
runode-cli = { path = "crates/cli" }
runode-completion = { path = "crates/completion" }
runode-prompt-highlight = { path = "crates/prompt-highlight" }
runode-config = { path = "crates/config" }
runode-preview = { path = "crates/preview" }
runode-agent-detect = { path = "crates/agent-detect" }
runode-remote-access = { path = "crates/remote-access" }
runode-update = { path = "crates/update" }
runode-autostart = { path = "crates/autostart" }
# libghostty-vt 的 Rust 绑定，源自 libghostty-rs（MIT 或 Apache-2.0）。依赖名沿用 libghostty-vt，
# 包名加 runode- 前缀，免得和 crates.io 上原项目的同名 crate 撞名。
libghostty-vt = { package = "runode-ghostty-vt", path = "crates/ghostty-vt" }
libghostty-vt-sys = { package = "runode-ghostty-vt-sys", path = "crates/ghostty-vt-sys" }
allocator-api2 = "0.4"
bitflags = "2"
int-enum = "1"
png = "0.18"
log = "0.4"
bindgen = "0.72"
heck = "0.5"
pkg-config = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
anyhow = "1"
portable-pty = "0.9"
futures = "0.3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
notify = "8"
# 命令补全的规格库（MIT）。不开 embed-signatures：那会把整个 JSON 目录原样编进二进制，
# 规格数据改由构建脚本压缩后嵌入。
warp-command-signatures = { path = "vendor/command-signatures/command-signatures", default-features = false }
miniz_oxide = "0.9"
# agent 识别规则的格式（TOML）和规则里的正则。
regex = "1"
toml = "1"
# 文件预览的语法高亮（MIT）。只开解析和纯 Rust 的 fancy-regex 正则后端，不链接 C 库；
# 语法定义取自 two-face（MIT 或 Apache-2.0），它的正则后端特性要和这里一致。
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# AppKit 和 Foundation 的绑定，只在 macOS 上用。不要默认特性，各 crate 按用到的类型自己开。
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-user-notifications = { version = "0.3", default-features = false }
# 给 Objective-C 的方法传回调（NSURLSession 的完成回调、问通知授权的回调）。
block2 = "0.6"
# 远程访问：TLS 1.3 用 rustls，密码学后端用 ring（不用默认的 aws-lc-rs，免得再编一份 C 的密码库），
# 只开 TLS 1.3；自签证书用 rcgen 生成，也走 ring。三者只许 runode-remote-access 直接依赖，见 deny.toml。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
# 配对的二维码：`runode remote pair` 画在终端里，设置窗口画在界面上；不要默认特性（画成图片、SVG 用不上）。
qrcode = { version = "0.14", default-features = false }

[profile.dev.package."*"]
opt-level = 2

# 发布构建。下面的数字在 M5 Max 上量，启动和内存用性能测量脚本（每个二进制 5 轮取中位数），
# 体积是 runode 二进制的字节数，构建时间是从空的 target 目录开始的整次构建（受机器当时的负载
# 影响，只看量级）。
[profile.release]
# 不用 "s" 或 "z"：libghostty-vt-sys 的构建脚本看到 OPT_LEVEL 是 s 或 z，会把 libghostty 换成
# ReleaseSmall 构建。
opt-level = 3
# 不能 abort：宿主的会话线程（`Runner::run`）靠 catch_unwind 兜住单个会话处理消息时的 panic，
# 只结束那一个会话，abort 会连整个 app 一起带走。
panic = "unwind"
# 各方案实测（体积 / 整次构建 / 只改桌面 crate 后重建）：
#   不开 LTO（原来的默认）       29.45 MiB /  66 秒 / 13.5 秒
#   thin LTO                    29.40 MiB /  61 秒 / —
#   thin LTO，codegen-units=1   24.91 MiB /  90 秒 / 39 秒
#   fat LTO                     23.51 MiB / 136 秒 / —
#   fat LTO，codegen-units=1    22.87 MiB / 147 秒 / 109 秒
# 开窗时间（中位数在首次和第二次启动都是 185～212 毫秒）、启动各节点、RSS（150～152 MiB）、宿主
# 的按键回显延迟和吞吐，各方案的差别都在测量的抖动以内，所以只比体积和构建时间。fat LTO 比 thin
# 只再小 2 MiB，改一点代码后的重建却要 109 秒，是 thin 的近 3 倍，选 thin LTO 加 codegen-units=1。
lto = "thin"
codegen-units = 1
# 只去掉调试信息，留着符号表（不写时发布构建也是这样）。改成 "symbols" 再小约 3.5 MiB（fat LTO
# 那份从 22.87 到 19.36 MiB），但 RUST_BACKTRACE 打出的 panic 回溯一帧函数名都没有了，系统的
# 崩溃报告里也只剩地址；panic 的消息和源码位置不靠符号表，两种都还在。
strip = "debuginfo"

# 本机装着自己用的发布构建（`make app`、`make install`）。上面的 thin LTO 加 codegen-units=1 在桌面
# crate 长大后，只改它一行也要重编约 108 秒；这里不开 LTO、并行代码生成、开增量编译，同样的改动
# 约 11 秒（M5 Max），二进制大约 5 MiB。启动和内存的差别在测量的抖动以内（见上面的实测），发给
# 用户的 dmg 和自动更新的 zip 仍用 release。
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# 只开现有代码已经满足的规则，防着以后倒退；新加规则时先把代码改干净。
[workspace.lints.rust]
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
# 调试用的宏和占位不留在代码里。
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# 输出一律走 tracing；构建脚本不受这两条限制。以后加命令行程序时在它自己的 crate 里放开。
print_stdout = "warn"
print_stderr = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
mut_mut = "warn"
ptr_as_ptr = "warn"
ref_option_ref = "warn"
wildcard_imports = "warn"
