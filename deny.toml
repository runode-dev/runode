# cargo-deny 的配置，CI 里只跑 `cargo deny check bans`，用来守住 crate 的分层：
# 界面框架只许 app（runode）和它的部件库（runode-ui）直接依赖，终端仿真和 PTY 只许 runode-terminal 直接依赖，
# 语法高亮只许 runode-preview 直接依赖，终端宿主只许 app 直接依赖，TLS 和密码学只许
# runode-remote 和推送中转 runode-push 直接依赖，SQLite 只许 runode-todo 直接依赖，
# 终端会话（runode-terminal）只许 app 和宿主直接依赖。
# `wrappers` 列出的 crate 可以直接依赖被禁的 crate，其他 crate 直接依赖时报错；经由这些
# crate 间接用到不算违规。

[bans]
# 这份配置只管分层，重复版本交给日常升级处理，不在这里报。
multiple-versions = "allow"
deny = [
    # gpui-pre 自己的平台后端（gpui-pre-macos 等）也直接依赖它，一并列入。
    { crate = "gpui-pre", wrappers = [
        "runode",
        "runode-ui",
        "gpui-pre-apple",
        "gpui-pre-ios",
        "gpui-pre-linux",
        "gpui-pre-macos",
        "gpui-pre-platform",
        "gpui-pre-web",
        "gpui-pre-wgpu",
        "gpui-pre-windows",
    ], reason = "只有 app 和它的部件库 runode-ui 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-platform", wrappers = ["runode"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    # 各平台层也是界面框架，只经 gpui-pre-platform 用；Apple 和 wgpu 的公共部分由平台层自己依赖（Linux 的 x11、wayland 后端用 wgpu 画）。
    { crate = "gpui-pre-macos", wrappers = ["gpui-pre-platform"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-ios", wrappers = ["gpui-pre-platform"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-linux", wrappers = ["gpui-pre-platform"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-windows", wrappers = ["gpui-pre-platform"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-web", wrappers = ["gpui-pre-platform"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-apple", wrappers = ["gpui-pre-macos", "gpui-pre-ios"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-wgpu", wrappers = ["gpui-pre-web", "gpui-pre-linux"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "runode-terminal", wrappers = ["runode", "runode-host"], reason = "终端会话只有宿主和 app 直接用；命令行经宿主的 socket 按 runode-protocol 说话" },
    { crate = "libghostty-vt", wrappers = ["runode-terminal"], reason = "终端仿真只在 runode-terminal 里" },
    { crate = "libghostty-vt-sys", wrappers = ["libghostty-vt"], reason = "终端仿真只在 runode-terminal 里，C 接口经 libghostty-vt 的安全封装用" },
    { crate = "portable-pty", wrappers = ["runode-terminal"], reason = "PTY 只在 runode-terminal 里" },
    { crate = "runode-host", wrappers = ["runode"], reason = "只有 app 直接用宿主：在自己进程里建它、或者以 runode --host 单独跑它，说话也经 runode-protocol；别的前端经 runode-protocol 连宿主的 socket，不直接依赖它" },
    # two-face 打包的语法定义要和 syntect 配套，它也直接依赖 syntect。
    { crate = "syntect", wrappers = ["runode-preview", "two-face"], reason = "语法高亮只在 runode-preview 里，对外给与界面无关的高亮结果" },
    { crate = "two-face", wrappers = ["runode-preview"], reason = "语法高亮只在 runode-preview 里，对外给与界面无关的高亮结果" },
    # ureq 是 sherpa-onnx-sys 的构建脚本下载预编译库用的，只在构建时跑，不进 app。
    { crate = "rustls", wrappers = ["runode-remote", "runode-push", "iroh", "iroh-dns", "iroh-relay", "n0-dns-resolver", "noq", "noq-proto", "hyper-rustls", "reqwest", "rustls-platform-verifier", "tokio-rustls", "ureq"], reason = "远程访问的 TLS 只在 runode-remote 里（连同它用的 iroh），推送中转 runode-push 自己连 APNs；别的 crate 经它们的接口用" },
    { crate = "iroh", wrappers = ["runode-remote"], reason = "远程访问跨网络的连接只在 runode-remote 里" },
    { crate = "mdns-sd", wrappers = ["runode-remote"], reason = "远程访问的 mDNS 公布只在 runode-remote 里" },
    { crate = "objc2-screen-capture-kit", wrappers = ["runode-screen"], reason = "远程桌面的屏幕采集只在 runode-screen 里" },
    { crate = "objc2-video-toolbox", wrappers = ["runode-screen"], reason = "远程桌面的视频编码只在 runode-screen 里" },
    { crate = "rusqlite", wrappers = ["runode-todo"], reason = "看板的库只在 runode-todo 里，别的 crate 经它的 Store 读写" },
    { crate = "sherpa-onnx", wrappers = ["runode-speech"], reason = "语音识别只在 runode-speech 里，别的 crate 经它的 Recognizer 用" },
    { crate = "rcgen", wrappers = ["runode-remote"], reason = "远程访问的自签证书只在 runode-remote 里生成" },
    # rustls、它的证书校验（rustls-webpki）和 rcgen 拿 ring 当密码学后端，也直接依赖它。
    { crate = "ring", wrappers = ["runode-remote", "runode-push", "rustls", "rustls-webpki", "rcgen", "noq-proto", "tokio-websockets"], reason = "远程访问的签名校验和随机数只在 runode-remote 里（连同它用的 iroh），推送中转 runode-push 自己封句柄、签 APNs 的 JWT" },
]
