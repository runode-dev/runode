# cargo-deny 的配置，CI 里只跑 `cargo deny check bans`，用来守住 crate 的分层：
# 界面框架只许 app（runode）直接依赖，终端仿真和 PTY 只许 runode-term 直接依赖。
# `wrappers` 列出的 crate 可以直接依赖被禁的 crate，其他 crate 直接依赖时报错；经由这些
# crate 间接用到不算违规。

[bans]
# 这份配置只管分层，重复版本交给日常升级处理，不在这里报。
multiple-versions = "allow"
deny = [
    # gpui-pre 自己的平台后端（gpui-pre-macos 等）也直接依赖它，一并列入。
    { crate = "gpui-pre", wrappers = [
        "runode",
        "gpui-pre-apple",
        "gpui-pre-linux",
        "gpui-pre-macos",
        "gpui-pre-platform",
        "gpui-pre-web",
        "gpui-pre-wgpu",
        "gpui-pre-windows",
    ], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "gpui-pre-platform", wrappers = ["runode"], reason = "只有 app 能依赖界面框架，其余 crate 不碰 GPUI" },
    { crate = "libghostty-vt", wrappers = ["runode-term"], reason = "终端仿真只在 runode-term 里，对外用 runode-model 的类型" },
    { crate = "portable-pty", wrappers = ["runode-term"], reason = "PTY 只在 runode-term 里" },
]
